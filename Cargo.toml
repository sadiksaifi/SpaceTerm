[package]
name = "spaceterm"
publish = false
edition = "2024"

[workspace]
members = [
    "crates/spaceterm-directories",
    "crates/spaceterm-ui",
    "third_party/libghostty-vt",
    "third_party/libghostty-vt-sys",
]
default-members = [".", "crates/spaceterm-directories", "crates/spaceterm-ui"]
resolver = "2"

[patch.crates-io]
accesskit = { git = "https://github.com/sadiksaifi/accesskit", tag = "spaceterm-2026-10-06" }
accesskit_consumer = { git = "https://github.com/sadiksaifi/accesskit", tag = "spaceterm-2026-10-06" }
accesskit_atspi_common = { git = "https://github.com/sadiksaifi/accesskit", tag = "spaceterm-2026-10-06" }
accesskit_macos = { git = "https://github.com/sadiksaifi/accesskit", tag = "spaceterm-2026-10-06" }

[features]
# Every build outside the packaging script is SpaceTerm Development and carries its developer tools.
default = ["developer-tools"]
native-tests = []
developer-tools = ["spaceterm-ui/control-preview"]

[[test]]
name = "macos_quick_look_ownership"
path = "tests/macos_quick_look_ownership.rs"
harness = false
required-features = ["native-tests"]

[[test]]
name = "macos_native_main_thread"
path = "tests/macos_native_main_thread.rs"
harness = false
required-features = ["native-tests"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
anyhow = "1.0.100"
async-channel = "2.5.0"
getrandom = "=0.4.3"
gpui = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-10-06" }
gpui_platform = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-10-06", features = ["font-kit"] }
image = { version = "=0.25.10", default-features = false }
libghostty-vt = { path = "third_party/libghostty-vt", default-features = false, features = ["kitty-graphics", "png"] }
libc = "=0.2.189"
notify = "=8.2.0"
portable-pty = "=0.9.0"
pollster = "=0.4.0"
smallvec = "=1.15.2"
rustc-hash = "=2.1.3"
spaceterm-directories = { path = "crates/spaceterm-directories" }
spaceterm-ui = { path = "crates/spaceterm-ui" }
thiserror = "2.0.17"
unicode-bidi = "=0.3.18"
unicode-segmentation = "=1.13.3"
zeroize = "=1.9.0"
same-file = "=1.0.6"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"
serde_json_lenient = "=0.2.4"

[target.'cfg(target_os = "linux")'.dependencies]
fontconfig_sys = { package = "yeslogic-fontconfig-sys", version = "=6.0.1" }
zbus = { version = "=5.19.0", features = ["blocking-api"] }
roxmltree = "=0.21.1"
gpui_platform = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-10-06", features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSAppearance", "NSApplication", "NSAttributedString", "NSBezierPath", "NSBitmapImageRep", "NSColor", "NSEvent", "NSFont", "NSFontDescriptor", "NSFontManager", "NSGlassEffectView", "NSGraphics", "NSGraphicsContext", "NSHelpManager", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSStringDrawing", "NSText", "NSUserInterfaceLayout", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2", "libc", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSBundle", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSNotification", "NSObject", "NSOperation", "NSProcessInfo", "NSRange", "NSString", "NSThread", "NSURL", "NSUserDefaults", "NSValue", "block2", "std"] }
objc2-quick-look-ui = { version = "=0.3.2", default-features = false, features = ["QLPreviewItem", "QLPreviewView", "objc2-app-kit"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNUserNotificationCenter", "block2"] }
raw-window-handle = "=0.6.2"

[dev-dependencies]
accesskit_consumer = "=0.38.0"
gpui = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-10-06", features = ["test-support"] }
jsonschema = { version = "=0.56.0", default-features = false }
spaceterm-ui = { path = "crates/spaceterm-ui", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_macos = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-10-06", features = ["font-kit", "test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-10-06" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Keep local feature-matrix builds compact. SpaceTerm retains line tables for its
# own crates while dependencies, build scripts, and proc macros omit debug data.
# Incremental caches are deliberately disabled because repeated check, test, and
# Clippy variants otherwise retain a separate large cache for each invocation.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = false

[profile.test.build-override]
debug = false
incremental = false
