name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Validate release tag
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # install_args selects this job's tools; keep mise run from installing the rest.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: "node npm:tagsmith"
      - name: Validate annotated release tag
        id: release
        timeout-minutes: 5
        run: mise run release:validate "$GITHUB_REF_NAME"

  validate:
    name: Validate macOS
    needs: tag
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install the Xcode Metal toolchain
        timeout-minutes: 10
        run: mise run setup:metal:macos
      - name: Restore Rust build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target/debug
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: validate-macos-26-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'mise.lock', 'third_party/libghostty-vt-sys/build.rs', 'third_party/libghostty-vt-sys/patches/*.patch') }}
      - name: Validate
        timeout-minutes: 60
        run: mise run validate:macos

  package:
    name: Package and sign Apple Silicon
    needs: tag
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install the Xcode Metal toolchain
        timeout-minutes: 10
        run: mise run setup:metal:macos
      - name: Fetch locked Rust dependencies
        timeout-minutes: 10
        run: mise run setup:deps
      - name: Build and verify Apple Silicon package
        timeout-minutes: 35
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: mise run release:package:macos "$RELEASE_TAG"
      - name: Sign and verify update assets
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: mise run release:assets:macos "$RELEASE_TAG"
      - name: Record signed asset checksum
        id: assets
        run: echo "checksum=$(shasum -a 256 dist/release/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
    outputs:
      checksum: ${{ steps.assets.outputs.checksum }}

  publish:
    name: Publish verified release
    needs: [tag, validate, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: "python git-cliff"
      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-release-assets
          path: dist/release
      - name: Verify transferred assets
        env:
          CHECKSUM: ${{ needs.package.outputs.checksum }}
        run: |
          printf '%s  %s\n' "$CHECKSUM" dist/release/SHA256SUMS | shasum -a 256 -c -
          cd dist/release
          shasum -a 256 -c SHA256SUMS
      - name: Publish complete GitHub release
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: mise run release:publish "$RELEASE_TAG"

  homebrew:
    name: Update Homebrew cask
    needs: [tag, package, publish]
    # brew bump-cask-pr edits the tapped cask in place.
    runs-on: macos-26
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: python
      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-release-assets
          path: dist/release
      - name: Verify transferred checksums
        env:
          CHECKSUM: ${{ needs.package.outputs.checksum }}
        run: printf '%s  %s\n' "$CHECKSUM" dist/release/SHA256SUMS | shasum -a 256 -c -
      - uses: actions/checkout@v7
        with:
          repository: sadiksaifi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: homebrew-tap
      - name: Tap the checkout
        run: |
          taps="$(brew --repository)/Library/Taps/sadiksaifi"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE/homebrew-tap" "$taps/homebrew-tap"
      - name: Update cask
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: mise run release:cask:macos "$RELEASE_TAG"
      - name: Commit and push cask
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Casks/spaceterm.rb
          if git diff --cached --quiet; then
            echo "The cask already matches SpaceTerm ${RELEASE_TAG}."
            exit 0
          fi
          git commit -m "release: spaceterm version ${RELEASE_TAG}" \
            -m "Release: https://github.com/sadiksaifi/SpaceTerm/releases/tag/${RELEASE_TAG}"
          git push
