min_version = "2026.9.6"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[env]
# Shared task code; see mise-tasks/lib.
PYTHONPATH = "{{config_root}}/mise-tasks/lib"

[tools]
python = "3.13.15"
ruff = "0.16.10"
ty = "0.0.84"
shellcheck = "0.11.0"
lefthook = "2.1.16"
cocogitto = "7.0.0"
git-cliff = "2.14.2"
node = "24.21.0"
zig = "0.16.0"
"cargo:cargo-packager" = { version = "0.11.8", os = ["macos"] }
"cargo:cargo-sweep" = "0.8.0"
"npm:skills" = "1.7.0"
"npm:tagsmith" = "1.2.0"
# The signed updater framework and its signing tools.
"github:sparkle-project/Sparkle" = { version = "2.10.0", asset_pattern = "Sparkle-2.10.0.tar.xz", os = ["macos"] }

[doctor.checks.xcode]
description = "Xcode 26 or newer with the Metal toolchain"
run = "python -m spaceterm_tasks.doctor xcode"
os = ["macos"]
hint = "Install Xcode 26 or newer, then run mise run setup:metal:macos"

[doctor.checks.terminfo]
description = "The terminfo compiler"
run = "python -m spaceterm_tasks.doctor tools tic infocmp"
hint = "Install ncurses (ncurses-bin on Debian or Ubuntu)"

[doctor.checks.linux-libraries]
description = "Linux window system and font libraries"
run = "pkg-config --exists xkbcommon xkbcommon-x11 wayland-client xcb x11-xcb fontconfig freetype2"
os = ["linux"]
hint = "Run mise run setup:packages"

[doctor.checks.vulkan]
description = "A Vulkan loader for GPUI"
run = "python -m spaceterm_tasks.doctor vulkan"
os = ["linux"]
hint = "Run mise run setup:packages, then install the Vulkan driver for your GPU"

[doctor.checks.linux-tools]
description = "Desktop entry, D-Bus, SSH, and zsh tools that Linux tests run"
run = "python -m spaceterm_tasks.doctor tools desktop-file-validate dbus-daemon dbus-run-session ssh zsh"
os = ["linux"]
hint = "Run mise run setup:packages"

[doctor.checks.gio]
description = "System Python GIO bindings for desktop entry tests"
run = "python -m spaceterm_tasks.doctor gio"
os = ["linux"]
hint = "Run mise run setup:packages"

# Debian and Ubuntu packages for building and testing on Linux.
[bootstrap.packages]
"apt:build-essential" = { os = "linux" }
"apt:pkg-config" = { os = "linux" }
"apt:libxkbcommon-dev" = { os = "linux" }
"apt:libxkbcommon-x11-dev" = { os = "linux" }
"apt:libwayland-dev" = { os = "linux" }
"apt:libxcb1-dev" = { os = "linux" }
"apt:libx11-xcb-dev" = { os = "linux" }
"apt:libfontconfig-dev" = { os = "linux" }
"apt:libfreetype-dev" = { os = "linux" }
"apt:libvulkan1" = { os = "linux" }
"apt:mesa-vulkan-drivers" = { os = "linux" }
"apt:ncurses-bin" = { os = "linux" }
"apt:openssh-client" = { os = "linux" }
"apt:dbus" = { os = "linux" }
"apt:desktop-file-utils" = { os = "linux" }
"apt:zsh" = { os = "linux" }
"apt:python3-gi" = { os = "linux" }
"apt:gir1.2-glib-2.0" = { os = "linux" }
"apt:python3-pyatspi" = { os = "linux" }
"apt:python3-dbus" = { os = "linux" }
"apt:python3-speechd" = { os = "linux" }
"apt:at-spi2-core" = { os = "linux" }
"apt:dconf-service" = { os = "linux" }
"apt:libglib2.0-bin" = { os = "linux" }
"apt:gsettings-desktop-schemas" = { os = "linux" }
"apt:gir1.2-gtk-3.0" = { os = "linux" }
"apt:xvfb" = { os = "linux" }
"apt:x11-utils" = { os = "linux" }
"apt:x11-xkb-utils" = { os = "linux" }
"apt:xdotool" = { os = "linux" }
"apt:imagemagick" = { os = "linux" }
"apt:gnome-shell" = { os = "linux" }
"apt:orca" = { os = "linux" }
"apt:speech-dispatcher" = { os = "linux" }
"apt:alsa-utils" = { os = "linux" }

# Task conventions:
# - Name tasks <entry>[:<narrowing>...][:<platform>] from CONTEXT.md terms or the wrapped tool's
#   name. Create no aliases.
# - Keep single-tool tasks here. Put other task logic in standard-library Python under mise-tasks/,
#   with shared code and unittest tests in mise-tasks/lib. Prefer maintained external tools.
# - Give each Development launch mode its own task. Use usage arguments or flags for other choices.
# - End platform-only tasks with the platform segment. Shared names dispatch to <task>:{{ os() }}
#   when implementations differ.
# - Set environment variables with env, guard destructive tasks with confirm, and hide only
#   internal tasks.

[tasks.setup]
description = "Prepare the development environment and run its checks"
run = [
  { task = "setup:packages" },
  { task = "setup:hooks" },
  { task = "setup:submodules" },
  { task = "setup:deps" },
  { task = "setup:skills" },
  "mise doctor project",
]

[tasks."setup:packages"]
description = "Install the system packages this host needs, after confirmation"
raw = true
run = "mise bootstrap packages apply"

[tasks."setup:hooks"]
description = "Install the Git hooks in lefthook.yml"
run = "lefthook install --reset-hooks-path"

[tasks."setup:submodules"]
description = "Initialize and update pinned Git submodules"
run = "git submodule update --init --recursive"

[tasks."setup:deps"]
description = "Download locked Rust dependencies"
run = "cargo fetch --locked"

[tasks."setup:skills"]
description = "Install the agent skills listed in skills-lock.json and share them with Claude Code"
env = { DISABLE_TELEMETRY = "1" }
run = ["skills experimental_install", "python -m spaceterm_tasks.agent_skills"]

[tasks."setup:metal:macos"]
description = "Install the Xcode Metal toolchain for native GPUI builds"
run = "xcodebuild -downloadComponent MetalToolchain"

[tasks.development]
description = "Run SpaceTerm Development from source"
run = [{ task = "development:{{ os() }}" }]

[tasks."development:workbench"]
description = "Open the Developer Workbench in SpaceTerm Development"
usage = '''
arg "[section]" help="Workbench section" default="appearance" {
  choices "appearance" "controls" "floating-surfaces" "modals" "terminal" "server-surfaces" "document"
}
'''
run = [{ task = "development:{{ os() }}", env = { SPACETERM_DEVELOPER_WORKBENCH = "{{usage.section}}" } }]

[tasks."development:updates"]
description = "Preview the real update UI in SpaceTerm Development with a simulated updater"
usage = '''
arg "[scenario]" help="Simulated updater state" default="available" {
  choices "available" "warning" "overdue" "startup-overdue" "startup-ready" "offline" "up-to-date" "check-error" "download-error" "verification-error" "install-error"
}
'''
run = [{ task = "development:{{ os() }}", env = { SPACETERM_UPDATE_PREVIEW = "{{usage.scenario}}" } }]

[tasks."fmt:check"]
description = "Check Rust and Python formatting"
run = [{ task = "fmt", args = ["--check"] }]

[tasks.lint]
description = "Run every linter that applies on any host"
run = [
  { task = "lint:rust" },
  { task = "lint:python" },
  { task = "lint:shell" },
  { task = "lint:diff" },
]

[tasks."lint:rust"]
description = "Lint every target and feature for the current platform"
run = "cargo clippy --all-targets --all-features --locked --no-deps -- -D warnings"

[tasks."lint:rust:portable"]
description = "Lint shared targets without native features"
run = "cargo clippy --all-targets --no-default-features --locked --no-deps -- -D warnings"

[tasks."lint:python"]
description = "Lint and type-check the Python task code"
run = ["ruff check", "ty check"]

[tasks."lint:shell"]
description = "Check the release installer"
run = "shellcheck packaging/install.sh"

[tasks."lint:plist:macos"]
description = "Check the application identity property lists"
run = "plutil -lint packaging/macos/development/Info.plist packaging/macos/preflight/Info.plist packaging/macos/preflight/Entitlements.plist packaging/macos/spaceterm/Info.plist packaging/macos/spaceterm/Entitlements.plist"

[tasks."lint:diff"]
description = "Check the diff for whitespace errors"
run = "git diff --check"

[tasks."lint:commit"]
description = "Validate a Conventional Commit message file"
usage = 'arg "<file>" help="Commit message file"'
run = "cog verify --ignore-merge-commits --file {{usage.file | quote}}"

[tasks.check]
description = "Check every target and feature"
run = "cargo check --all-targets --all-features --locked"

[tasks."check:portable"]
description = "Check shared targets without native features"
run = "cargo check --all-targets --no-default-features --locked"

[tasks.test]
description = "Run tests with every feature for the current platform"
usage = 'arg "[filter]" help="Run only tests whose names contain this filter"'
run = "cargo test --all-targets --all-features --locked {{usage.filter | quote}}"

[tasks."test:portable"]
description = "Run shared tests without native features"
run = "cargo test --all-targets --no-default-features --locked"

[tasks."test:rustdoc"]
description = "Compile and test Rust documentation examples"
# Explicit --doc selects generated C-header prose even when the sys crate has doctest = false.
run = "cargo test --workspace --exclude libghostty-vt-sys --doc --all-features --locked"

[tasks."test:conformance"]
description = "Run terminal protocol conformance tests"
run = "cargo test --package spaceterm --all-targets --no-default-features --locked terminal::conformance"

[tasks."test:native"]
description = "Run native Adapter tests for the current platform"
run = [{ task = "test:native:{{ os() }}" }]

[tasks."test:native:macos"]
description = "Run native macOS and shared Unix Adapter tests"
run = "cargo test --package spaceterm --all-targets --features native-tests --locked -- macos unix"

[tasks."test:native:linux"]
description = "Run native Linux and shared Unix Adapter tests"
run = "cargo test --package spaceterm --all-targets --features native-tests --locked -- linux unix"

[tasks."test:tools"]
description = "Test the shared task code in mise-tasks/lib"
run = "python -m unittest discover --start-directory mise-tasks/lib/tests --top-level-directory mise-tasks/lib"

[tasks."test:server:host"]
description = "Test headless server host adapters"
usage = 'arg "[filter]" help="Run only server host tests whose names contain this text"'
run = "cargo test --package spaceterm-host --all-targets --locked --no-fail-fast {{usage.filter | quote}}"

[tasks."test:server:native:tools"]
description = "Test native server verification tooling"
run = "python -m unittest tests.test_server_native"

[tasks."test:server:native:acl:macos"]
description = "Test in-memory macOS credential ACL construction without Keychain changes"
run = "python -I mise-tasks/server/native/macos/acl_tests.py"

[tasks."test:server:native:acl:asan:macos"]
description = "Check native credential policy memory safety and allocation failures"
run = "python -I mise-tasks/server/native/macos/acl_tests.py --sanitizers"

[tasks."test:server:native:companion:macos"]
description = "Test the temporary GUI evidence companion's model, interactions, and app build"
run = "python -I mise-tasks/server/native/macos/companion_tests.py"

[tasks."test:server:native:companion:asan:macos"]
description = "Check the GUI evidence companion's model and interactions with ASan and UBSan"
run = "python -I mise-tasks/server/native/macos/companion_tests.py --sanitizers"

[tasks."test:server:native:companion:tools"]
description = "Test GUI evidence companion source policy and bundle metadata on any platform"
run = "python -I mise-tasks/server/native/macos/companion_tests.py --portable"

[tasks."test:server:native:handoff:tools"]
description = "Test startup-pipe tooling; native fault cases require the explicit macOS fault task"
run = "python -m unittest tests.test_server_handoff"

[tasks."check:server:native:handoff:macos"]
description = "Compile the nonauthorizing native startup-pipe prototype"
run = "python -I mise-tasks/server/native/macos/handoff_tests.py"

[tasks."test:server:native:handoff:macos"]
description = "Test bounded native startup-pipe frame recognition"
run = "python -I mise-tasks/server/native/macos/handoff_tests.py --run"

[tasks."test:server:native:handoff:asan:macos"]
description = "Check native startup-pipe frame memory safety"
run = "python -I mise-tasks/server/native/macos/handoff_tests.py --run --sanitizers"

[tasks."test:server:native:handoff:faults:macos"]
description = "Build the private native fault fixture and require all 29 handoff regressions without skips"
run = "python -I mise-tasks/server/native/macos/handoff_tests.py --faults"

[tasks."test:server:native:handoff:faults:asan:macos"]
description = "Build the sanitized private native fault fixture and require all 29 handoff regressions"
run = "python -I mise-tasks/server/native/macos/handoff_tests.py --faults --sanitizers"

[tasks."test:server:vm:tools"]
description = "Test disposable server verification VM tooling"
run = "python -m unittest tests.test_server_vm"

[tasks."test:server:vm:executor"]
description = "Test disposable VM preparation and startup execution"
run = "python -m unittest tests.test_server_vm_executor"

[tasks."test:server:vm:authentication"]
description = "Test VM artifact authentication and bounded native processes"
run = "python -m unittest tests.test_server_vm_linux"

[tasks."test:server:vm:linux:prototype"]
description = "Test the bounded Linux prototype registration and build its native fixtures"
run = "bash mise-tasks/server/vm/linux/test.sh"

[tasks."test:server:vm:linux:prototype:asan"]
description = "Test the Linux prototype registration with address and undefined behavior sanitizers"
run = "bash mise-tasks/server/vm/linux/test.sh --sanitizers"

[tasks."test:server:vm:linux:selinux:cleanup"]
description = "Test SELinux fixture cleanup and enforcement restoration inside the disposable guest"
run = "sudo -n bash tests/server_native/linux/selinux_verify_tests.sh"

[tasks."lint:server:vm:linux"]
description = "Check disposable Linux evidence shell scripts"
run = "shellcheck mise-tasks/server/vm/linux/*.sh tests/server_native/linux/*.sh"

[tasks."server:vm:linux:prepare"]
description = "Install the pinned build tools inside the disposable Jammy guest"
run = "bash mise-tasks/server/vm/linux/prepare.sh --disposable-jammy"

[tasks."server:vm:linux:install"]
description = "Install the credential-free system service prototype inside the disposable guest"
run = "sudo -n bash mise-tasks/server/vm/linux/install.sh --disposable-jammy"

[tasks."server:vm:linux:verify"]
description = "Observe final account credentials, nondumpability, and listener absence"
run = "sudo -n bash mise-tasks/server/vm/linux/verify.sh"

[tasks."server:vm:linux:lifecycle"]
description = "Test crash restart and durable Stop and Start in the disposable guest"
run = "sudo -n bash mise-tasks/server/vm/linux/lifecycle.sh"

[tasks."server:vm:linux:boot-check"]
description = "Observe the registered desired state after a guest reboot"
usage = 'arg "state" help="Expected running or stopped registration state"'
run = "sudo -n bash mise-tasks/server/vm/linux/boot-check.sh {{usage.state | quote}}"

[tasks."server:vm:linux:reboot"]
description = "Reboot only the explicitly selected disposable Jammy guest"
run = "sudo -n bash mise-tasks/server/vm/linux/reboot.sh --disposable-jammy"

[tasks."server:vm:linux:selinux:prepare"]
description = "Install permissive SELinux in the disposable Jammy guest for the next boot"
run = "sudo -n bash mise-tasks/server/vm/linux/selinux-prepare.sh --disposable-jammy"

[tasks."server:vm:linux:selinux:policy"]
description = "Install the confined-domain SELinux mechanism experiment"
run = "sudo -n bash mise-tasks/server/vm/linux/selinux-policy.sh --disposable-jammy"

[tasks."server:vm:linux:selinux:verify"]
description = "Test confined inode write denials without claiming full account custody"
run = "sudo -n bash mise-tasks/server/vm/linux/selinux-verify.sh"

[tasks."check:server:host"]
description = "Check headless server host adapters"
run = "cargo check --package spaceterm-host --all-targets --locked"

[tasks."lint:server:host"]
description = "Lint headless server host adapters"
run = "cargo clippy --package spaceterm-host --all-targets --locked --no-deps -- -D warnings"

[tasks."server:lock"]
description = "Refresh headless server workspace metadata without upgrading unrelated packages"
run = "cargo update --workspace --offline"

[tasks.validate]
description = "Run the full validation gate for the current platform"
run = [{ task = "validate:{{ os() }}" }]

[tasks."validate:macos"]
description = "Run the full macOS validation gate"
run = [
  { task = "test:tools" },
  { task = "fmt:check" },
  { task = "lint" },
  { task = "lint:plist:macos" },
  { task = "check" },
  { task = "test" },
  { task = "test:rustdoc" },
  { task = "test:native:macos" },
  { task = "engine:test" },
  { task = "engine:test:no-graphics" },
  { task = "test:package:macos" },
  { task = "test:install:macos" },
  { task = "test:updater:macos" },
]

[tasks."validate:linux"]
description = "Run the full Linux validation gate"
run = [
  { task = "test:tools" },
  { task = "fmt:check" },
  { task = "lint" },
  { task = "check" },
  { task = "test:accessibility:linux", args = ["--backend", "both"] },
  { task = "test:accessibility:regressions:linux" },
  { task = "test" },
  { task = "test:rustdoc" },
  { task = "test:native:linux" },
  { task = "engine:test" },
  { task = "engine:test:no-graphics" },
  { task = "test:package:linux" },
  { task = "test:install:linux" },
  { task = "test:updater:linux" },
]

[tasks."validate:portable"]
description = "Run checks that need no native platform tooling"
run = [
  { task = "test:tools" },
  { task = "fmt:check" },
  { task = "lint:rust:portable" },
  { task = "lint:python" },
  { task = "lint:shell" },
  { task = "lint:diff" },
  { task = "check:portable" },
  { task = "test:portable" },
]

[tasks."engine:build"]
description = "Build the pinned Ghostty source and SpaceTerm C bindings"
run = "cargo build --package libghostty-vt-sys --features kitty-graphics --locked"

[tasks."engine:bindings"]
description = "Regenerate Rust bindings from the matching patched Ghostty headers"
run = "cargo run --package libghostty-vt-sys --features bindgen-tool,kitty-graphics --bin gen-bindings --locked"

[tasks."engine:check"]
description = "Check every feature of the locally maintained Ghostty wrappers"
run = "cargo check --package libghostty-vt --all-features --locked"

[tasks."engine:lock"]
description = "Refresh local patched dependency entries without upgrading unrelated packages"
run = "cargo update --package libghostty-vt-sys --offline"

[tasks."engine:test"]
description = "Test terminal-library patches with the application feature set"
run = "cargo test --package libghostty-vt --package libghostty-vt-sys --lib --no-default-features --features libghostty-vt/kitty-graphics,libghostty-vt/png,libghostty-vt-sys/vendored --locked"

[tasks."engine:test:no-graphics"]
description = "Test the owned Rust wrappers with graphics disabled"
run = "cargo test --package libghostty-vt --package libghostty-vt-sys --lib --no-default-features --features libghostty-vt-sys/vendored --locked"

[tasks."engine:upstream:build"]
description = "Build a prepared Ghostty source copy while updating native patches"
usage = '''
arg "<source>" help="Prepared Ghostty source directory"
flag "--features <features>" help="Upstream VT feature selection" default="all"
'''
run = "zig build --build-file {{usage.source | quote}}/build.zig -Demit-lib-vt=true -Demit-xcframework=false -Dapp-runtime=none -Dcpu=baseline -Doptimize=Debug -Dvt-features={{usage.features | quote}}"

[tasks."engine:upstream:test"]
description = "Run upstream native VT tests in a prepared Ghostty source copy"
usage = '''
arg "<source>" help="Prepared Ghostty source directory"
flag "--filter <filter>" help="Run Zig tests whose names contain this text"
'''
run = "cd {{usage.source | quote}} && zig build test-lib-vt -Demit-lib-vt=true -Demit-xcframework=false -Dapp-runtime=none -Dcpu=baseline{% if usage.filter %} -Dtest-filter={{usage.filter | quote}}{% endif %}"

[tasks."artifacts:sweep"]
description = "Remove Cargo build artifacts unused for 14 days"
run = "cargo sweep --time 14"

[tasks."artifacts:clean"]
description = "Remove every Cargo build artifact"
confirm = "Remove every Cargo build artifact?"
run = "cargo clean"

[tasks."release:targets"]
description = "Validate the Tagsmith release configuration"
run = "tagsmith targets --json"

[tasks."release:preview"]
description = "Preview an annotated release tag without creating it"
usage = 'arg "<version>" help="Stable SemVer to release"'
run = "tagsmith tag --target spaceterm --channel stable --version {{usage.version | quote}} --dry-run --json"

[tasks."release:validate"]
description = "Validate an annotated release tag on origin"
usage = 'arg "<tag>" help="Stable release tag, for example v1.2.3"'
run = "tagsmith validate --tag {{usage.tag | quote}} --github-output"

[tasks."release:notes:preview"]
description = "Preview release notes for changes since the last release"
run = "git-cliff --config cliff.toml --unreleased --offline --strip all"

[tasks."check:headless"]
description = "Reject graphical dependencies in headless server and client crates"
run = "python -m spaceterm_tasks.headless"

[tasks."test:headless:tools"]
description = "Test the headless dependency classifier"
run = "python -m unittest tests.test_headless"

[tasks."test:server:contracts"]
description = "Test portable domain contracts and headless composition skeletons"
run = "cargo test --package spaceterm-core --package spaceterm-client --package spaceterm-server --all-targets --locked"

[tasks."check:server:contracts"]
description = "Check portable domain contracts and headless composition skeletons"
run = "cargo check --package spaceterm-core --package spaceterm-client --package spaceterm-server --all-targets --locked"

[tasks."lint:server:contracts"]
description = "Lint portable domain contracts and headless composition skeletons"
run = "cargo clippy --package spaceterm-core --package spaceterm-client --package spaceterm-server --all-targets --locked --no-deps -- -D warnings"

[tasks."test:protocol"]
description = "Run both SpaceTerm Protocol major profiles and authentication conformance"
run = "cargo test --package spaceterm-protocol --locked"

[tasks."protocol:check-schema"]
description = "Generate and check both protocol profiles with pinned Rust schema compilers"
run = "cargo check --package spaceterm-protocol --locked"

[tasks."test:server:native:installation"]
description = "Test bounded native registration, installation and journal policy without privilege"
run = "python -I mise-tasks/server/native/installation_tests.py"

[tasks."test:server:native:linux-credentials"]
description = "Test bounded Linux credential output without credential-tool execution"
run = "python -I mise-tasks/server/native/installation_tests.py --linux-credentials"

[tasks."check:server:distribution"]
description = "Check headless release metadata and archive authentication"
run = "cargo check -p spaceterm-distribution --all-targets --locked"

[tasks."test:server:distribution"]
description = "Test frozen client feeds and separate server artifacts"
run = "cargo test -p spaceterm-distribution --all-targets --locked"

[tasks."lint:server:distribution"]
description = "Lint headless artifact verification"
run = "cargo clippy -p spaceterm-distribution --all-targets --locked --no-deps -- -D warnings"

# Native phase 2 registrations. Producer tracks replace unavailable modules and supply new task bodies.

[tasks."test:server:native:launcher:macos"]
description = "Test native launcher mechanics without privileged host effects"
run = "python -I mise-tasks/server/native/macos/launcher_tests.py --run"

[tasks."test:server:native:launcher:asan:macos"]
description = "Test native launcher mechanics with address and undefined behavior sanitizers"
run = "python -I mise-tasks/server/native/macos/launcher_tests.py --run --sanitizers"

[tasks."test:server:native:keychain:macos"]
description = "Test injected Keychain item mechanics without privileged host effects"
run = "python -I mise-tasks/server/native/macos/keychain_items_tests.py"

[tasks."test:server:native:keychain:asan:macos"]
description = "Test injected Keychain item mechanics with address and undefined behavior sanitizers"
run = "python -I mise-tasks/server/native/macos/keychain_items_tests.py --sanitizers"

[tasks."test:server:native:management:macos"]
description = "Test native management mechanics without privileged host effects"
run = "python -I mise-tasks/server/native/macos/management_tests.py"

[tasks."test:server:native:management:asan:macos"]
description = "Test native management mechanics with address and undefined behavior sanitizers"
run = "python -I mise-tasks/server/native/macos/management_tests.py --sanitizers"

[tasks."test:server:native:capabilities:macos"]
description = "Test native capability mechanics without privileged host effects"
run = "python -I mise-tasks/server/native/macos/capability_tests.py"

[tasks."test:server:native:capabilities:asan:macos"]
description = "Test native capability mechanics with address and undefined behavior sanitizers"
run = "python -I mise-tasks/server/native/macos/capability_tests.py --sanitizers"

[tasks."test:server:native:keychain-items:tools"]
description = "Test bounded Keychain fixture result validation"
run = "python -I mise-tasks/server/native/macos/keychain_items_tests.py --self-test"

[tasks."test:server:native:management:linux"]
description = "Test fixed Linux management policy without host mutation"
run = "python -I mise-tasks/server/native/linux/management_tests.py"

[tasks."test:server:native:management:tools"]
description = "Test portable management boundaries without authorization"
run = "python -I mise-tasks/server/native/macos/management_tests.py --tools"

[tasks."test:server:native:capabilities:tools"]
description = "Test portable capability observation tooling"
run = "python -I mise-tasks/server/native/macos/capability_tests.py --python-tests"

[tasks."test:server:native:authority"]
description = "Test actual host native authority interfaces with injected native peers"
run = "python -I mise-tasks/server/native/authority_tests.py"

[tasks."test:server:native:handoff:composition"]
description = "Test actual host launcher and receiver composition interfaces with injected native peers"
run = "python -I mise-tasks/server/native/handoff_composition_tests.py"

[tasks."test:server:native:management:composition"]
description = "Test actual host native management composition interfaces with injected native peers"
run = "python -I mise-tasks/server/native/management_composition_tests.py"

[tasks."test:server:native:evidence:composition"]
description = "Test actual host native evidence composition interfaces with injected native peers"
run = "python -I mise-tasks/server/native/evidence_composition_tests.py"

[tasks."test:server:native:evidence:tools"]
description = "Test native evidence assembly and receipt recovery without host mutation"
run = "python -m unittest tests.test_server_native_macos"

[tasks."test:server:native:evidence:schema"]
description = "Test strict bounded native evidence records and collection"
run = "python -m unittest tests.test_native_evidence_schema"

[tasks."server:native:macos:prepare-evidence"]
description = "Assemble existing signed fixtures without changing host integration"
usage = '''
flag "--fixtures <path>" help="Existing signed fixture directory"
'''
run = "python -I mise-tasks/server/native/macos/prepare_evidence.py {% if usage.fixtures %}--fixtures {{usage.fixtures | quote}}{% endif %}"

[tasks."server:native:macos:collect-evidence"]
description = "Validate native evidence without inventing missing observations"
usage = '''
flag "--input <path>" required=#true help="Bounded native JSONL input"
flag "--profile <profile>" default="local" { choices "local" "disposable" }
'''
run = "python -I mise-tasks/server/native/macos/collect_evidence.py --input {{usage.input | quote}} --profile {{usage.profile | quote}}"

[tasks."server:native:macos:build-evidence"]
description = "Build exact evidence fixtures using Cargo artifact paths"
run = "python -I mise-tasks/server/native/macos/build_evidence.py"

[tasks."server:native:macos:run-evidence"]
description = "Run the reviewed receipt-bound native evidence sequence"
usage = '''
flag "--profile <profile>" default="local" { choices "local" "disposable" }
'''
run = "python -I mise-tasks/server/native/macos/run_evidence.py --profile {{usage.profile | quote}}"

[tasks."test:server:custody:portable"]
description = "Test native Linux custody policy and Stop release serialization"
run = "cargo test --package spaceterm-host --locked --test linux_support_policy --test linux_custody_authority --test linux_release_fence"

[tasks."test:server:custody:tools"]
description = "Test bounded custody packaging and evidence tooling"
run = "python -I mise-tasks/server/native/custody_tools_tests.py"

[tasks."test:server:custody:linux"]
description = "Test unprivileged Linux custody and handoff fixture mechanics"
run = "python -I mise-tasks/server/native/linux/custody/tests.py"

[tasks."test:server:custody:asan:linux"]
description = "Test Linux custody fixture memory safety without privileged suites"
run = "python -I mise-tasks/server/native/linux/custody/tests.py --sanitizers"

[tasks."server:vm:custody:install:linux"]
description = "Install only authenticated custody artifacts inside the owned Jammy guest"
usage = '''
flag "--disposable-jammy" required=#true
flag "--artifact <path>" required=#true
flag "--signature <path>" required=#true
flag "--trust-receipt <path>" required=#true
'''
run = "python -I mise-tasks/server/vm/linux/custody_install.py --disposable-jammy --artifact {{usage.artifact | quote}} --signature {{usage.signature | quote}} --trust-receipt {{usage.trust_receipt | quote}}"

[tasks."server:vm:custody:verify:linux"]
description = "Run one fixed custody suite inside the owned Jammy guest"
usage = '''
arg "suite" { choices "handoff" "memory" "aliases" "publication" "mount-evidence" "support-policy" "packaged-execution" "durability" }
'''
run = "python -I mise-tasks/server/vm/linux/custody_verify.py {{usage.suite | quote}}"

[tasks."server:vm:custody:lifecycle:linux"]
description = "Verify supervised custody lifecycle inside the owned Jammy guest"
run = "python -I mise-tasks/server/vm/linux/custody_lifecycle.py"

[tasks."server:vm:custody:boot-check:linux"]
description = "Verify exact desired state after reboot of the same owned Jammy guest"
usage = '''
arg "state" { choices "running" "stopped" }
'''
run = "python -I mise-tasks/server/vm/linux/custody_boot_check.py {{usage.state | quote}}"

[tasks."server:vm:custody:manage:linux"]
description = "Start or stop only the fixed evidence registration inside the owned Jammy guest"
usage = '''
arg "operation" { choices "start" "stop" }
'''
run = "python -I mise-tasks/server/vm/linux/custody_manage.py {{usage.operation | quote}}"

[tasks."server:vm:custody:reboot:linux"]
description = "Reboot only the receipt-bound disposable Jammy guest"
usage = '''
flag "--disposable-jammy" required=#true
'''
run = "python -I mise-tasks/server/vm/linux/custody_reboot.py --disposable-jammy"

[tasks."server:vm:custody:cleanup:linux"]
description = "Cleanup only the receipt-bound disposable Jammy guest"
usage = '''
flag "--disposable-jammy" required=#true
'''
run = "python -I mise-tasks/server/vm/linux/custody_cleanup.py --disposable-jammy"
