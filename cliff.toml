[changelog]
header = ""
# Every release opens with download buttons for its disk image and Linux desktop archive.
# They belong in body because the release task strips header and footer.
# The first release lists no commits.
body = """
{% set v = version | trim_start_matches(pat="v") %}\
[![Download for macOS](https://img.shields.io/badge/Download-macOS-10B981?style=for-the-badge&labelColor=1F2937&logo=apple&logoColor=white)](https://github.com/sadiksaifi/SpaceTerm/releases/download/{{ version }}/SpaceTerm-{{ v }}-macos-arm64.dmg)&emsp;[![Download for Linux](https://img.shields.io/badge/Download-Linux-10B981?style=for-the-badge&labelColor=1F2937&logo=linux&logoColor=white)](https://github.com/sadiksaifi/SpaceTerm/releases/download/{{ version }}/spaceterm-desktop-{{ v }}-linux-x86_64.tar.gz)
{% if not previous.version %}
First release of SpaceTerm.
{% else %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}\
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/sadiksaifi/SpaceTerm/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}\
{% endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
split_commits = false
protect_breaking_commits = true
# Greenfield releases start at 0.10.0.
tag_pattern = '^v(?:0\.(?:1[0-9]|[2-9][0-9]|[1-9][0-9]{2,})|[1-9][0-9]*\.(?:0|[1-9][0-9]*))\.(?:0|[1-9][0-9]*)$'
use_branch_tags = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^(build|chore|ci|refactor|revert|style|test)", group = "Maintenance" },
  { message = ".*", group = "Other changes" },
]
