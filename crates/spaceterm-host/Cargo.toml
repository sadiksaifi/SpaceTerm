[package]
name = "spaceterm-host"
publish = false
edition = "2024"

[dependencies]
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["io-util", "net", "time", "sync", "rt", "macros"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
x509-parser = "=0.18.1"
zeroize = "=1.9.0"
socket2 = "=0.6.5"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["test-util"] }
tempfile = "=3.27.0"
rcgen = { version = "=0.14.5", default-features = false, features = ["ring"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "=0.2.189"
