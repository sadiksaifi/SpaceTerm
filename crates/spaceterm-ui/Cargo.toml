[package]
name = "spaceterm-ui"
publish = false
edition = "2024"
license = "GPL-3.0-only"

[features]
control-preview = []
# Lets dependent crates read a test window's accessibility tree.
test-support = ["dep:serde_json", "gpui/test-support"]

[dependencies]
fuzzy-matcher = "=0.3.7"
gpui = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-10-07.1" }
lucide-icons = { version = "=1.34.0", default-features = false }
serde_json = { version = "1.0", optional = true }
unicode-casefold = "=0.2.0"
unicode-segmentation = "=1.13.3"
zeroize = "=1.9.0"

[dev-dependencies]
gpui = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-10-07.1", features = ["test-support"] }
serde_json = "1.0"
