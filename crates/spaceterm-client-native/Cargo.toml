[package]
name = "spaceterm-client-native"
publish = false
edition = "2024"

[features]
default = []
cli = []
native-tests = []

[[bin]]
name = "spaceterm-cli"
path = "src/bin/spaceterm-cli.rs"
required-features = ["cli"]

[[test]]
name = "client_credentials_native"
path = "tests/client_credentials_native.rs"
required-features = ["native-tests"]

[dependencies]
spaceterm-client = { path = "../spaceterm-client" }
spaceterm-core = { path = "../spaceterm-core" }
spaceterm-host = { path = "../spaceterm-host" }
spaceterm-protocol = { path = "../spaceterm-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
base64 = "=0.22.1"
ring = "=0.17.14"
zeroize = "=1.9.0"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
cbc = { version = "=0.1.2", features = ["zeroize"] }
hkdf = "=0.12.4"
num-bigint-dig = { version = "=0.9.1", features = ["zeroize"] }
sha2 = "=0.10.9"
