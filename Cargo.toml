[package]
name = "spaceterm"
version = "0.0.0"
edition = "2024"

[package.metadata.packager]
product-name = "SpaceTerm"
identifier = "io.github.sadiksaifi.spaceterm"
formats = ["app", "dmg"]
out-dir = "dist"
category = "DeveloperTool"
binaries = [{ path = "SpaceTerm", main = true }]
icons = ["target/package-macos/SpaceTerm.icns"]
resources = [
    { src = "target/package-macos/Assets.car", target = "Assets.car" },
    { src = "target/package-macos/terminfo", target = "terminfo" },
    { src = "assets/shell-integration", target = "shell-integration" },
    { src = "assets/THIRD-PARTY-NOTICES.txt", target = "THIRD-PARTY-NOTICES.txt" },
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
signing-identity = "-"
info-plist-path = "target/package-macos/Info.plist"

[package.metadata.packager.dmg]
window-size = { width = 600, height = 400 }
app-position = { x = 180, y = 170 }
application-folder-position = { x = 480, y = 170 }

[workspace]
members = ["crates/spaceterm-ui", "third_party/libghostty-vt", "third_party/libghostty-vt-sys"]
default-members = [".", "crates/spaceterm-ui"]
resolver = "2"

[features]
default = []
macos-native-tests = []
appearance-exerciser = []

[build-dependencies]
serde = "1.0"
serde_json = "1.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
anyhow = "1.0.100"
async-channel = "2.5.0"
getrandom = "=0.4.3"
gpui = "=0.2.2"
image = { version = "=0.25.10", default-features = false }
libghostty-vt = { path = "third_party/libghostty-vt", default-features = false, features = ["kitty-graphics", "png"] }
libc = "=0.2.189"
portable-pty = "=0.9.0"
smallvec = "=1.15.2"
spaceterm-ui = { path = "crates/spaceterm-ui" }
thiserror = "2.0.17"
unicode-bidi = "=0.3.18"
unicode-segmentation = "=1.13.3"
zeroize = "=1.9.0"
same-file = "=1.0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block = "=0.1.6"
cocoa = "=0.26.0"
objc = "=0.2.7"
raw-window-handle = "=0.6.2"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
