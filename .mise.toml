description = "Run desktop application tests"
usage = 'arg "[filter]" help="Run only desktop tests whose names contain this text"'
env = { CARGO_BUILD_JOBS = "3" }
run = "cargo test --package spaceterm --bin spaceterm --locked {{usage.filter | quote}}"

