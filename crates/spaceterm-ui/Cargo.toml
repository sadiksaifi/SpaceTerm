[package]
name = "spaceterm-ui"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[dependencies]
gpui = "=0.2.2"
unicode-segmentation = "=1.13.3"
zeroize = "=1.9.0"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
resvg = { version = "=0.45.1", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
