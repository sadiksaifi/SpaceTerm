# Add these declarations to the coordinator-owned .mise.toml during integration.
[tasks."test:server:native:capabilities:macos"]
description = "Test synthetic capability deadlines and records and build native adapters without permission changes"
run = "python -I mise-tasks/server/native/macos/capability_tests.py"

[tasks."test:server:native:capabilities:asan:macos"]
description = "Run synthetic capability regressions with AddressSanitizer and UndefinedBehaviorSanitizer"
run = "python -I mise-tasks/server/native/macos/capability_tests.py --sanitizers"

[tasks."test:server:native:capabilities:tools"]
description = "Test portable capability tooling without native effects"
run = "python -I mise-tasks/server/native/macos/capability_tests.py --python-tests"
