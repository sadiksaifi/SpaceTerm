[package]
name = "spaceterm-core"
publish = false
edition = "2024"
autobins = false

[features]
default = []
client = ["dep:getrandom", "dep:security-framework", "dep:security-framework-sys", "dep:core-foundation", "dep:zbus", "dep:futures-lite", "dep:async-io", "dep:pollster"]
# Lets another crate's tests serve a client handle in process.
test-support = ["client", "spaceterm-client/test-support"]
# Fakes for developer-tools preview builds and other crates' tests.
developer-tools = ["spaceterm-protocol/developer-tools"]
# Tests that change this account's native system state, such as Launch Services.
native-tests = []

[dependencies]
spaceterm-client = { path = "../spaceterm-client", features = ["core-transport"] }
getrandom = { version = "=0.4.3", optional = true }
base64 = "=0.22.1"
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }
libc = "=0.2.189"
ring = "=0.17.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
socket2 = "=0.6.5"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["alloc", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
zeroize = "=1.9.0"
spaceterm-protocol = { path = "../spaceterm-protocol" }
spaceterm-directories = { path = "../spaceterm-directories" }
thiserror = "2.0.17"
bytes = "1"
noq-udp = { version = "=1.4.0", default-features = false }
noq-proto = { version = "=1.4.0", default-features = false, features = ["rustls-ring"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }

# The server reads and requests its own System Permissions, and its service reads its Login Items
# status.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSString", "NSURL", "std"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }

security-framework = { version = "=3.7.0", optional = true }
security-framework-sys = { version = "=2.17.0", optional = true }
core-foundation = { version = "=0.10.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", features = ["blocking-api"], optional = true }
futures-lite = { version = "=2.6.1", optional = true }
async-io = { version = "=2.6.0", optional = true }
pollster = { version = "=0.4.0", optional = true }

[dev-dependencies]
spaceterm-client = { path = "../spaceterm-client", features = ["test-support"] }
spaceterm-protocol = { path = "../spaceterm-protocol", features = ["developer-tools"] }
