syntax = "proto3";
package spaceterm.common;

// UUID-shaped opaque handles, never native authority. All identities are 16 bytes.
message Identity { bytes value = 1; }
message Entity { Identity server = 1; uint64 local_id = 2; }
message Session { Entity pane = 1; uint64 server_epoch = 2; uint64 generation = 3; }
message EffectFence {
  Session session = 1;
  Identity client = 2;
  uint64 control_generation = 3;
  uint64 connection_generation = 4;
  uint64 context_generation = 5;
}
message Limits {
  uint32 frame_bytes = 1;
  uint32 management_bytes = 2;
  uint32 semantic_rows = 3;
  uint32 semantic_cells = 4;
  uint32 resource_chunk_bytes = 5;
  uint32 concurrent_transfers = 6;
  uint32 paste_bytes = 7;
  uint32 clipboard_bytes = 8;
}
enum Purpose { PURPOSE_UNSPECIFIED = 0; ORDINARY = 1; REVOCATION_STATUS = 2; }
enum Direction { DIRECTION_UNSPECIFIED = 0; CLIENT_TO_SERVER = 1; SERVER_TO_CLIENT = 2; }
message ClientHello {
  Identity expected_server = 1;
  Identity device = 2;
  Identity pairing = 3;
  Identity client = 4;
  bytes nonce = 5;
  repeated uint32 majors = 6;
  repeated uint32 capabilities = 7;
  Limits limits = 8;
  Purpose purpose = 9;
}
message ServerHello {
  Identity server = 1;
  bytes nonce = 2;
  uint64 epoch = 3;
  bytes connection_nonce = 4;
  repeated uint32 majors = 5;
  uint32 selected_major = 6;
  repeated uint32 capabilities = 7;
  Limits accepted_limits = 8;
  Purpose purpose = 9;
}
// All proofs use Ed25519. The signed input concatenates a u64 big-endian byte
// length and the exact bytes for each component, in this order:
//   "SpaceTerm Protocol Ed25519 v1", domain label, domain-specific parts.
// Domains and parts:
//   "server-hello": received ClientHello bytes, ServerHello body bytes;
//   "device-proof": original ClientHello bytes, received ServerHello body bytes;
//   "ready": ClientHello bytes, ServerHello body bytes, Ready body bytes;
//   "authenticated-envelope": AuthenticatedEnvelope body bytes.
// The device proof is sent as 64 raw signature bytes. Other proofs use Signed.
// The connection binding is SHA-256 of the same length-delimited encoding with
// domain "connection-binding" and parts ClientHello bytes, ServerHello body bytes.
// Majors, capabilities, accepted limits, purpose, epoch and both fresh nonces are
// therefore bound without decoding and reencoding any received transcript bytes.
message Signed { bytes body = 1; bytes signature = 2; }
message Ready {
  bytes transcript = 1;
  bytes device_proof = 2;
  Identity pairing = 3;
  Identity client = 4;
  Purpose purpose = 5;
}
message AuthenticatedEnvelope {
  Direction direction = 1;
  uint32 major = 2;
  bytes binding = 3;
  uint64 sequence = 4;
  bytes payload = 5;
  Purpose purpose = 6;
}
