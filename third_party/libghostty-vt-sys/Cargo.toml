[package]
edition = "2024"
rust-version = "1.90"
name = "libghostty-vt-sys"
version = "0.2.1"
build = "build.rs"
links = "ghostty-vt"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Raw FFI bindings for libghostty-vt, the Ghostty terminal emulation library"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sadiksaifi/SpaceTerm"
publish = false
resolver = "2"

[features]
bindgen-tool = [
    "dep:bindgen",
    "dep:libc",
    "dep:heck",
]
default = ["vendored"]
kitty-graphics = []
link-dynamic = []
vendored = []

[lib]
name = "libghostty_vt_sys"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "gen-bindings"
path = "tools/gen_bindings.rs"
required-features = ["bindgen-tool"]

[dependencies.bindgen]
version = "0.72.1"
optional = true

[dependencies.heck]
version = "0.5"
optional = true

[dependencies.libc]
version = "0.2"
optional = true
