name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Validate release tag
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # install_args selects this job's tools; keep mise run from installing the rest.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: "node npm:tagsmith"
      - name: Validate annotated release tag
        id: release
        timeout-minutes: 5
        run: mise run release:validate "$GITHUB_REF_NAME"

  validate:
    name: Validate macOS
    needs: tag
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install the Xcode Metal toolchain
        timeout-minutes: 10
        run: mise run setup:metal:macos
      - name: Validate
        timeout-minutes: 60
        run: mise run validate:macos

  package:
    name: Package and sign Apple Silicon
    needs: tag
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install the Xcode Metal toolchain
        timeout-minutes: 10
        run: mise run setup:metal:macos
      - name: Fetch locked Rust dependencies
        timeout-minutes: 10
        run: mise run setup:deps
      - name: Build and verify Apple Silicon package
        timeout-minutes: 35
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          MACOS_SIGNING_CERTIFICATE_P12: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12 }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: mise run release:package:macos "$RELEASE_TAG"
      - name: Sign and verify update assets
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: mise run release:assets:macos "$RELEASE_TAG"
      - name: Record signed asset checksum
        id: assets
        run: echo "checksum=$(shasum -a 256 dist/release/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: signed-release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
    outputs:
      checksum: ${{ steps.assets.outputs.checksum }}

  validate-linux:
    name: Validate Linux
    needs: tag
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install Linux build and test packages
        timeout-minutes: 30
        run: mise bootstrap packages apply --yes --update
      - name: Check the development environment
        run: mise doctor project
      - name: Cache Rust builds
        uses: actions/cache@v6
        with:
          path: |
            target/debug
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: validate-linux-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'mise.lock', 'third_party/libghostty-vt-sys/build.rs', 'third_party/libghostty-vt-sys/patches/*.patch') }}
      - name: Validate
        timeout-minutes: 60
        run: mise run validate:linux

  package-linux:
    name: Package and sign x86_64 Linux
    needs: tag
    runs-on: ubuntu-26.04
    # The release links against Ubuntu 22.04's glibc 2.35 so it runs on every supported host.
    container: ubuntu:22.04
    timeout-minutes: 75
    steps:
      - name: Install checkout, compiler, and signing tools
        timeout-minutes: 10
        # mise compiles its Cargo tools, so the compiler and linker come before mise.
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl git openssl pkg-config xz-utils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Trust the checkout
        # The container user differs from the owner of the mounted workspace.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install rustup
        # The container has no Rust. The default is the toolchain rust-toolchain.toml pins, so
        # mise builds its Cargo tools with it outside the checkout too.
        timeout-minutes: 5
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --no-modify-path --profile minimal --default-toolchain "$toolchain"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v5
      - name: Install Linux build packages
        timeout-minutes: 10
        run: mise bootstrap packages apply --yes
      - name: Fetch locked Rust dependencies
        timeout-minutes: 10
        run: mise run setup:deps
      - name: Build and verify x86_64 Linux package
        timeout-minutes: 45
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: mise run release:package:linux "$RELEASE_TAG"
      - name: Sign and verify Linux update assets
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: mise run release:assets:linux "$RELEASE_TAG"
      - name: Record signed asset checksum
        id: assets
        run: echo "checksum=$(sha256sum dist/release-linux/SHA256SUMS | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload signed Linux release assets
        uses: actions/upload-artifact@v7
        with:
          name: signed-linux-release-assets
          path: dist/release-linux/
          if-no-files-found: error
          retention-days: 7
    outputs:
      checksum: ${{ steps.assets.outputs.checksum }}

  publish:
    name: Publish verified release
    needs: [tag, validate, package, validate-linux, package-linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: "python git-cliff"
      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-release-assets
          path: dist/release
      - name: Download signed Linux release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-linux-release-assets
          path: dist/release-linux
      - name: Verify transferred assets
        env:
          CHECKSUM: ${{ needs.package.outputs.checksum }}
          LINUX_CHECKSUM: ${{ needs.package-linux.outputs.checksum }}
        run: |
          printf '%s  %s\n' "$CHECKSUM" dist/release/SHA256SUMS | shasum -a 256 -c -
          printf '%s  %s\n' "$LINUX_CHECKSUM" dist/release-linux/SHA256SUMS | shasum -a 256 -c -
          (cd dist/release && shasum -a 256 -c SHA256SUMS)
          (cd dist/release-linux && shasum -a 256 -c SHA256SUMS)
      - name: Publish complete GitHub release
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: mise run release:publish "$RELEASE_TAG"

  homebrew:
    name: Update Homebrew cask
    needs: [tag, package, publish]
    # brew bump-cask-pr edits the tapped cask in place.
    runs-on: macos-26
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: python
      - name: Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: signed-release-assets
          path: dist/release
      - name: Verify transferred checksums
        env:
          CHECKSUM: ${{ needs.package.outputs.checksum }}
        run: printf '%s  %s\n' "$CHECKSUM" dist/release/SHA256SUMS | shasum -a 256 -c -
      - uses: actions/checkout@v7
        with:
          repository: sadiksaifi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: homebrew-tap
      - name: Tap the checkout
        run: |
          taps="$(brew --repository)/Library/Taps/sadiksaifi"
          mkdir -p "$taps"
          rm -rf "$taps/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE/homebrew-tap" "$taps/homebrew-tap"
      - name: Update cask
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: mise run release:cask:macos "$RELEASE_TAG"
      - name: Commit and push cask
        working-directory: homebrew-tap
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Casks/spaceterm.rb
          if git diff --cached --quiet; then
            echo "The cask already matches SpaceTerm ${RELEASE_TAG}."
            exit 0
          fi
          git commit -m "release: spaceterm version ${RELEASE_TAG}" \
            -m "Release: https://github.com/sadiksaifi/SpaceTerm/releases/tag/${RELEASE_TAG}"
          git push
