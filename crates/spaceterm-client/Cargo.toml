[package]
name = "spaceterm-client"
publish = false
edition = "2024"

[features]
default = []
# Shared QUIC listener and transport surface used by SpaceTerm Core.
core-transport = []
test-support = []

[dependencies]
spaceterm-protocol = { path = "../spaceterm-protocol" }
async-channel = "=2.5.0"
base64 = "=0.22.1"
bytes = "1"
getrandom = "=0.4.3"
libc = "=0.2.189"
noq-proto = { version = "=1.4.0", default-features = false, features = ["rustls-ring"] }
noq-udp = { version = "=1.4.0", default-features = false }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["alloc", "std"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
socket2 = "=0.6.5"
thiserror = "2.0.17"
zeroize = "=1.9.0"
