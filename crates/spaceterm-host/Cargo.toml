[package]
name = "spaceterm-host"
publish = false
edition = "2024"

[features]
native-tests = []
test-support = []

[dependencies]
spaceterm-core = { path = "../spaceterm-core" }
spaceterm-protocol = { path = "../spaceterm-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
ring = "=0.17.14"
zeroize = "=1.9.0"
getrandom = "=0.4.3"
spaceterm-distribution = { path = "../spaceterm-distribution" }
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }
same-file = "=1.0.6"
thiserror = "=2.0.19"
rusqlite = { version = "=0.37.0", features = ["bundled", "hooks"] }
tokio = { version = "=1.53.1", features = ["io-util", "net", "time", "sync", "rt", "macros"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
x509-parser = "=0.18.1"
rcgen = { version = "=0.14.5", default-features = false, features = ["ring"] }
socket2 = "=0.6.5"
sha2 = "=0.10.9"
hmac = "=0.12.1"
hkdf = "=0.12.4"
subtle = "=2.6.1"
serde_json = "1.0"
base64 = "=0.22.1"
spaceterm-directories = { path = "../spaceterm-directories" }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["test-util"] }
tempfile = "=3.27.0"
rcgen = { version = "=0.14.5", default-features = false, features = ["ring"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "=0.2.189"
anyhow = "1.0.100"
portable-pty = "=0.9.0"

[[test]]
name = "organization_store"
path = "tests/organization_store.rs"
required-features = ["test-support"]

[[test]]
name = "organization_store_schema"
path = "tests/organization_store_schema.rs"
required-features = ["test-support"]

[[test]]
name = "organization_store_recovery"
path = "tests/organization_store_recovery.rs"
required-features = ["test-support"]

[[test]]
name = "organization_store_auxiliary"
path = "tests/organization_store_auxiliary.rs"
required-features = ["test-support"]

[[test]]
name = "organization_store_seed"
path = "tests/organization_store_seed.rs"
required-features = ["test-support"]

[[test]]
name = "organization_store_faults"
path = "tests/organization_store_faults.rs"
required-features = ["test-support"]

[[test]]
name = "organization_store_crash"
path = "tests/organization_store_crash.rs"
required-features = ["test-support"]
[[bin]]
name = "spaceterm-server-launcher"
path = "src/bin/spaceterm-server-launcher.rs"

[[bin]]
name = "spaceterm-server-manager"
path = "src/bin/spaceterm-server-manager.rs"

[[bin]]
name = "spaceterm-server-spawner"
path = "src/bin/spaceterm-server-spawner.rs"

[[bin]]
name = "spaceterm-native-evidence-admin"
path = "src/bin/spaceterm-native-evidence-admin.rs"
required-features = ["native-tests"]

[[bin]]
name = "spaceterm-native-evidence-client"
path = "src/bin/spaceterm-native-evidence-client.rs"
required-features = ["native-tests"]
