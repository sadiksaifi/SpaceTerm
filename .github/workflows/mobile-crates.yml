name: Mobile crates

on: pull_request

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  MISE_LOCKED: 'true'

jobs:
  tag-policy:
    name: Check desktop and libspaceterm tag history
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: python node npm:tagsmith
          version: 2026.10.4
          cache: false
      - name: Dry-run both release targets
        run: |
          mise run release:targets
          mise run test:tools tests.test_release_plan.TagPolicyTests

  external-consumer:
    name: Build external consumer (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-ios
          - runner: ubuntu-26.04
            target: aarch64-linux-android
    env:
      LIBSPACETERM_TEST_TAG: libspaceterm@v0.1.0
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          install_args: python rust
          version: 2026.10.4
          cache: false
      - name: Install Rust target
        run: rustup target add "$RUST_TARGET"
      - name: Locate iOS SDK
        if: matrix.target == 'aarch64-apple-ios'
        run: xcrun --sdk iphoneos --show-sdk-path
      - name: Set up Android compiler
        if: matrix.target == 'aarch64-linux-android'
        run: |
          ndk_bin="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin"
          clang="$ndk_bin/aarch64-linux-android21-clang"
          "$clang" --version
          {
            printf 'CC_aarch64_linux_android=%s\n' "$clang"
            printf 'AR_aarch64_linux_android=%s\n' "$ndk_bin/llvm-ar"
            printf 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=%s\n' "$clang"
          } >> "$GITHUB_ENV"
      - name: Build crates from a local annotated libspaceterm tag
        run: |
          GIT_COMMITTER_DATE="$(git show -s --format=%cI HEAD)"
          export GIT_COMMITTER_DATE
          git -c user.name='SpaceTerm CI' -c user.email='ci@example.invalid' \
            tag -a "$LIBSPACETERM_TEST_TAG" -m 'libspaceterm build test'
          mise run check:mobile-consumer "$RUST_TARGET" "$LIBSPACETERM_TEST_TAG"
