[package]
name = "spaceterm"
publish = false
edition = "2024"

[workspace]
members = [
    "crates/spaceterm-directories",
    "crates/spaceterm-server",
    "crates/spaceterm-server-host",
    "crates/spaceterm-ui",
    "third_party/libghostty-vt",
    "third_party/libghostty-vt-sys",
]
default-members = [".", "crates/spaceterm-directories", "crates/spaceterm-server", "crates/spaceterm-server-host", "crates/spaceterm-ui"]
resolver = "2"

[patch.crates-io]
accesskit = { git = "https://github.com/sadiksaifi/accesskit", tag = "spaceterm-2026-10-19" }
accesskit_consumer = { git = "https://github.com/sadiksaifi/accesskit", tag = "spaceterm-2026-10-19" }
accesskit_atspi_common = { git = "https://github.com/sadiksaifi/accesskit", tag = "spaceterm-2026-10-19" }
accesskit_macos = { git = "https://github.com/sadiksaifi/accesskit", tag = "spaceterm-2026-10-19" }
accesskit_unix = { git = "https://github.com/sadiksaifi/accesskit", tag = "spaceterm-2026-10-19" }

[features]
# Every build outside the packaging script is SpaceTerm Development and carries its developer tools.
default = ["desktop", "developer-tools"]
# Native fixtures also exercise the desktop adapters.
native-tests = ["desktop-tests"]
developer-tools = ["desktop-tests", "spaceterm-ui/control-preview"]
desktop-tests = [
    "desktop",
    "gpui/test-support",
    "spaceterm-ui/test-support",
    "dep:accesskit_consumer",
    "dep:jsonschema",
    "gpui_macos/test-support",
    "dep:gpui_wgpu",
]
desktop = [
    "dep:gpui",
    "dep:gpui_platform",
    "dep:spaceterm-ui",
    "spaceterm-server/client",
    "dep:image",
    "dep:notify",
    "dep:smallvec",
    "dep:rustc-hash",
    "dep:unicode-bidi",
    "dep:unicode-segmentation",
    "dep:ureq",
    "dep:tar",
    "dep:flate2",
    "dep:ring",
    "dep:base64",
    "dep:fontconfig_sys",
    "dep:zbus",
    "dep:roxmltree",
    "dep:block2",
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-av-foundation",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-quick-look-ui",
    "dep:objc2-user-notifications",
    "dep:raw-window-handle",
    "dep:security-framework",
    "dep:security-framework-sys",
    "dep:core-foundation",
    "dep:futures-lite",
    "dep:async-io",
    "dep:gpui_macos",
]

[[bin]]
name = "spaceterm"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "macos_quick_look_ownership"
path = "tests/macos_quick_look_ownership.rs"
harness = false
required-features = ["native-tests"]

[[test]]
name = "macos_native_main_thread"
path = "tests/macos_native_main_thread.rs"
harness = false
required-features = ["native-tests"]

[build-dependencies]
sha2 = "0.10"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
anyhow = "1.0.100"
async-channel = "2.5.0"
getrandom = "=0.4.3"
gpui = { git = "https://github.com/sadiksaifi/zed", rev = "1f24094367dfb32a04007a9f7f7d1bcb61f56b30", optional = true }
gpui_platform = { git = "https://github.com/sadiksaifi/zed", rev = "1f24094367dfb32a04007a9f7f7d1bcb61f56b30", features = ["font-kit"], optional = true }
image = { version = "=0.25.10", default-features = false, optional = true }
libghostty-vt = { path = "third_party/libghostty-vt", default-features = false, features = ["kitty-graphics", "png"] }
libc = "=0.2.189"
notify = { version = "=8.2.0", optional = true }
portable-pty = "=0.9.0"
pollster = "=0.4.0"
smallvec = { version = "=1.15.2", optional = true }
rustc-hash = { version = "=2.1.3", optional = true }
spaceterm-directories = { path = "crates/spaceterm-directories" }
spaceterm-ui = { path = "crates/spaceterm-ui", optional = true }
spaceterm-server = { path = "crates/spaceterm-server" }
thiserror = "2.0.17"
unicode-bidi = { version = "=0.3.18", optional = true }
unicode-segmentation = { version = "=1.13.3", optional = true }
zeroize = "=1.9.0"
same-file = "=1.0.6"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
tar = { version = "=0.4.46", default-features = false, optional = true }
flate2 = { version = "=1.1.10", optional = true }
ring = { version = "=0.17.14", optional = true }
base64 = { version = "=0.22.1", optional = true }
serde_json_lenient = "=0.2.4"

accesskit_consumer = { version = "=0.38.0", optional = true }
jsonschema = { version = "=0.56.0", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
futures-lite = { version = "=2.6.1", optional = true }
async-io = { version = "=2.6.0", optional = true }
fontconfig_sys = { package = "yeslogic-fontconfig-sys", version = "=6.0.1", optional = true }
zbus = { version = "=5.19.0", features = ["blocking-api"], optional = true }
roxmltree = { version = "=0.21.1", optional = true }
gpui_platform = { git = "https://github.com/sadiksaifi/zed", rev = "1f24094367dfb32a04007a9f7f7d1bcb61f56b30", features = ["wayland", "x11"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true }
security-framework-sys = { version = "=2.17.0", optional = true }
core-foundation = { version = "=0.10.1", optional = true }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "=0.3.1", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"], optional = true }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityElement", "NSAccessibilityProtocols", "NSAlert", "NSAppearance", "NSApplication", "NSAttributedString", "NSBezierPath", "NSBitmapImageRep", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSFontDescriptor", "NSFontManager", "NSGlassEffectView", "NSGraphics", "NSGraphicsContext", "NSHelpManager", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPanel", "NSPasteboard", "NSPasteboardItem", "NSParagraphStyle", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSStringDrawing", "NSText", "NSUserInterfaceLayout", "NSView", "NSVisualEffectView", "NSWindow", "NSWorkspace", "block2", "libc", "objc2-core-foundation"], optional = true }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSAttributedString", "NSBundle", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSNotification", "NSObject", "NSOperation", "NSProcessInfo", "NSRange", "NSString", "NSThread", "NSURL", "NSUserDefaults", "NSValue", "block2", "std"], optional = true }
objc2-quick-look-ui = { version = "=0.3.2", default-features = false, features = ["QLPreviewItem", "QLPreviewView", "objc2-app-kit"], optional = true }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["UNNotificationContent", "UNNotificationRequest", "UNNotificationSettings", "UNUserNotificationCenter", "block2"], optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies.gpui_macos]
git = "https://github.com/sadiksaifi/zed"
rev = "1f24094367dfb32a04007a9f7f7d1bcb61f56b30"
features = ["font-kit"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.gpui_wgpu]
git = "https://github.com/sadiksaifi/zed"
rev = "1f24094367dfb32a04007a9f7f7d1bcb61f56b30"
optional = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# Keep local feature-matrix builds compact. SpaceTerm retains line tables for its
# own crates while dependencies, build scripts, and proc macros omit debug data.
# Incremental caches are deliberately disabled because repeated check, test, and
# Clippy variants otherwise retain a separate large cache for each invocation.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = false

[profile.test.build-override]
debug = false
incremental = false
