[package]
name = "spaceterm-server"
publish = false
edition = "2024"

[features]
default = ["graphics"]
graphics = ["spaceterm-terminal/kitty-graphics", "spaceterm-terminal/png"]
native-tests = ["spaceterm-host/native-tests"]
test-support = ["spaceterm-host/test-support"]

[dependencies]
spaceterm-host = { path = "../spaceterm-host" }
libc = "=0.2.189"
spaceterm-distribution = { path = "../spaceterm-distribution" }
spaceterm-core = { path = "../spaceterm-core" }
spaceterm-protocol = { path = "../spaceterm-protocol" }
spaceterm-terminal = { path = "../spaceterm-terminal", default-features = false, features = ["runtime"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
getrandom = "=0.4.3"
sha2 = "=0.10.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
prost = "=0.14.4"
zeroize = "=1.9.0"
rustix = { version = "=1.1.5", features = ["event", "fs"] }
thiserror = "=2.0.19"

[[test]]
name = "signed_stopped_owner_composition"
path = "tests/signed_stopped_owner_composition.rs"
required-features = ["test-support"]

[dev-dependencies]
spaceterm-client-native = { path = "../spaceterm-client-native", default-features = false, features = ["test-support"] }
base64 = "=0.22.1"
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }
prost = "=0.14.4"
tempfile = "=3.27.0"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
rcgen = { version = "=0.14.5", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.1", default-features = false, features = ["test-util"] }
ring = "=0.17.14"
spaceterm-client = { path = "../spaceterm-client", default-features = false, features = ["test-support"] }
spaceterm-host = { path = "../spaceterm-host", features = ["test-support", "native-tests"] }
