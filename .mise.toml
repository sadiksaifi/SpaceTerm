[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
zig = "0.16.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
python = "3.13.15"
"cargo:cargo-packager" = "0.11.8"

[tasks.setup]
description = "Prepare the shared development environment"
run = [
  { task = "deps:submodules" },
  { task = "deps:fetch" },
  { task = "doctor" },
]

[tasks."deps:submodules"]
description = "Initialize and update pinned Git submodules"
run = "git submodule update --init --recursive"

[tasks.doctor]
description = "Verify shared development tools"
run = '''
set -eu
cargo --version
cargo clippy --version
rustfmt --version
cargo packager --version
zig version
python3 --version
shellcheck --version | head -n 1
actionlint -version
'''

[tasks."deps:fetch"]
description = "Download locked Rust dependencies"
run = "cargo fetch --locked"

[tasks."deps:build"]
description = "Build the pinned Ghostty source and SpaceTerm C bindings"
run = "./scripts/cargo-artifacts.sh run -- cargo build --package libghostty-vt-sys --features kitty-graphics --locked"

[tasks."deps:engine"]
description = "Build a prepared Ghostty source copy while updating native patches"
usage = '''
arg "<source>" help="Prepared Ghostty source directory"
flag "--features <features>" help="Upstream VT feature selection" default="all"
'''
run = '''
cd "${usage_source?}"
zig build -Demit-lib-vt=true -Demit-xcframework=false -Dapp-runtime=none -Dcpu=baseline -Doptimize=Debug "-Dvt-features=${usage_features?}"
'''

[tasks."deps:bindings"]
description = "Regenerate Rust bindings from the matching patched Ghostty headers"
run = "./scripts/cargo-artifacts.sh run -- cargo run --package libghostty-vt-sys --features bindgen-tool,kitty-graphics --bin gen-bindings --locked"

[tasks."deps:engine:test"]
description = "Run upstream native VT tests in a prepared Ghostty source copy"
usage = '''
arg "<source>" help="Prepared Ghostty source directory"
'''
run = '''
cd "${usage_source?}"
zig build test-lib-vt -Demit-lib-vt=true -Demit-xcframework=false -Dapp-runtime=none -Dcpu=baseline
'''

[tasks."deps:check"]
description = "Check every feature of the locally maintained Ghostty wrappers"
run = "./scripts/cargo-artifacts.sh run -- cargo check --package libghostty-vt --all-features --locked"

[tasks."deps:lock"]
description = "Refresh local patched dependency entries without upgrading unrelated packages"
run = "cargo update --package libghostty-vt-sys --package gpui --offline"

[tasks."deps:fmt"]
description = "Format the locally maintained Ghostty integration"
run = "cargo fmt --package libghostty-vt --package libghostty-vt-sys"

[tasks."deps:fmt:check"]
description = "Check formatting of the locally maintained Ghostty integration"
run = "cargo fmt --package libghostty-vt --package libghostty-vt-sys -- --check"

[tasks.dev]
description = "Run SpaceTerm from source"
run = "python3 scripts/run-development-app.py dev"

[tasks."dev:macos"]
description = "Run SpaceTerm Dev from a source-built macOS application bundle"
run = "exec bash scripts/run-development-app-macos.sh dev"

[tasks."dev:appearance"]
description = "Run the appearance exerciser with isolated retained settings"
run = "python3 scripts/run-development-app.py appearance"

[tasks.check]
description = "Check every target and feature"
run = "./scripts/cargo-artifacts.sh run -- cargo check --package spaceterm --package spaceterm-directories --package spaceterm-ui --all-targets --all-features --locked"

[tasks."dev:appearance:macos"]
description = "Run the source appearance exerciser as a separate inspectable macOS app"
run = "exec bash scripts/run-development-app-macos.sh appearance"

[tasks."check:portable"]
description = "Check shared targets without native features"
run = "./scripts/cargo-artifacts.sh run -- cargo check --package spaceterm --package spaceterm-directories --package spaceterm-ui --all-targets --no-default-features --locked"

[tasks.fmt]
description = "Format shared Rust sources"
run = "cargo fmt --package spaceterm --package spaceterm-directories --package spaceterm-ui"

[tasks."fmt:files"]
description = "Format selected Rust files during focused changes"
usage = '''
arg "<files>..." help="Rust files to format"
'''
run = '''python3 -c 'import os, shlex, subprocess; subprocess.run(["rustfmt", "--edition", "2024", *shlex.split(os.environ["usage_files"])], check=True)' '''

[tasks."fmt:check"]
description = "Check shared Rust formatting"
run = "cargo fmt --package spaceterm --package spaceterm-directories --package spaceterm-ui -- --check"

[tasks.test]
description = "Run all tests with every feature for the current platform"
run = "./scripts/cargo-artifacts.sh run -- cargo test --package spaceterm --package spaceterm-directories --package spaceterm-ui --all-targets --all-features --locked"

[tasks."test:portable"]
description = "Run shared tests without native features"
run = "./scripts/cargo-artifacts.sh run -- cargo test --package spaceterm --package spaceterm-directories --package spaceterm-ui --all-targets --no-default-features --locked"

[tasks."test:one"]
description = "Run tests matching a filter"
usage = '''
arg "<filter>" help="Test name filter"
'''
run = './scripts/cargo-artifacts.sh run -- cargo test --package spaceterm --package spaceterm-directories --package spaceterm-ui --all-targets --all-features --locked "${usage_filter?}"'

[tasks."test:vendor"]
description = "Test terminal-library patches with the application feature set"
run = "./scripts/cargo-artifacts.sh run -- cargo test --package libghostty-vt --package libghostty-vt-sys --lib --no-default-features --features libghostty-vt/kitty-graphics,libghostty-vt/png,libghostty-vt-sys/vendored --locked"

[tasks."test:vendor:no-graphics"]
description = "Test the owned Rust wrappers with graphics disabled"
run = "./scripts/cargo-artifacts.sh run -- cargo test --package libghostty-vt --package libghostty-vt-sys --lib --no-default-features --features libghostty-vt-sys/vendored --locked"

[tasks."test:conformance"]
description = "Run terminal protocol conformance tests"
run = "./scripts/cargo-artifacts.sh run -- cargo test --package spaceterm --all-targets --no-default-features --locked terminal::conformance"

[tasks."lint:rust"]
description = "Lint every target and feature for the current platform"
run = "./scripts/cargo-artifacts.sh run -- cargo clippy --package spaceterm --package spaceterm-directories --package spaceterm-ui --all-targets --all-features --locked --no-deps -- -D warnings"

[tasks."lint:portable"]
description = "Lint shared targets without native features"
run = "./scripts/cargo-artifacts.sh run -- cargo clippy --package spaceterm --package spaceterm-directories --package spaceterm-ui --all-targets --no-default-features --locked --no-deps -- -D warnings"

[tasks."lint:scripts"]
description = "Check shared scripts"
run = '''
set -eu
shellcheck -x scripts/kitty-graphics-smoke-unix.sh
shellcheck -x scripts/cargo-artifacts.sh scripts/test-cargo-artifacts.sh
actionlint .github/workflows/*.yml
python3 -c 'import ast, pathlib, sys; [ast.parse(pathlib.Path(name).read_text(), filename=name) for name in sys.argv[1:]]' scripts/cargo-artifact-supervisor.py scripts/cargo-build-executable.py scripts/run-development-app.py scripts/terminal-resource-workload.py scripts/kitty-graphics-smoke.py
'''

[tasks."lint:diff"]
description = "Check the diff for whitespace errors"
run = "git diff --check"

[tasks.lint]
description = "Run shared linters"
run = [
  { task = "lint:rust" },
  { task = "lint:scripts" },
  { task = "lint:diff" },
]

[tasks."validate:portable"]
description = "Run checks without native tooling"
run = [
  { task = "artifacts:test" },
  { task = "fmt:check" },
  { task = "check:portable" },
  { task = "test:portable" },
  { task = "lint:portable" },
  { task = "lint:diff" },
]

[tasks.validate]
description = "Run the full validation gate for the current platform"
run = [
  { task = "artifacts:test" },
  { task = "fmt:check" },
  { task = "check" },
  { task = "test" },
  { task = "lint" },
  { task = "test:vendor" },
  { task = "test:vendor:no-graphics" },
  { task = "deps:fmt:check" },
]

[tasks."smoke:unix:kitty-graphics"]
description = "Display Kitty graphics checks inside a running SpaceTerm Pane on Unix"
usage = '''
arg "[scenario]" help="Scenario: all, basics, placeholders, relative, animation, lifecycle, screens" default="all"
flag "--dump" help="Emit a fixture without prompts or delays"
'''
run = '''
if [ "${usage_dump:-false}" = "true" ]; then
  ./scripts/kitty-graphics-smoke-unix.sh "${usage_scenario?}" --dump
else
  ./scripts/kitty-graphics-smoke-unix.sh "${usage_scenario?}"
fi
'''

[tasks."build:release"]
description = "Build the optimized executable for the current platform"
run = "./scripts/cargo-artifacts.sh run -- cargo build --release --locked"

[tasks."artifacts:status"]
description = "Show Cargo artifact usage and the enforced disk budget"
run = "./scripts/cargo-artifacts.sh status"

[tasks."artifacts:clean"]
description = "Remove Cargo build artifacts from the active target directory"
run = "./scripts/cargo-artifacts.sh clean"

[tasks."artifacts:test"]
description = "Test Cargo artifact budget and cleanup behavior"
run = "./scripts/test-cargo-artifacts.sh"

[tasks."bench:workload"]
description = "Run a paced workload in a dedicated terminal Pane"
usage = '''
arg "[mode]" help="Workload mode" default="scroll"
arg "[duration]" help="Duration in seconds" default="60"
arg "[rate]" help="Updates per second" default="60"
'''
run = 'python3 scripts/terminal-resource-workload.py --mode "${usage_mode}" --duration "${usage_duration}" --rate "${usage_rate}"'

[tasks."setup:macos"]
description = "Prepare the macOS development environment"
run = [
  { task = "setup" },
  { task = "doctor:macos" },
]

[tasks."doctor:macos"]
description = "Verify macOS development and packaging tools"
run = '''
set -eu
version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
major="${version%%.*}"
test "$major" -ge 26 || {
  echo "Xcode 26 or newer is required, got: $version" >&2
  exit 1
}
xcrun --find codesign
xcrun --find actool
xcrun --find assetutil
xcrun --find hdiutil
xcrun --find iconutil
xcrun --find tic
'''

[tasks."fmt:macos"]
description = "Format isolated macOS Adapter sources"
run = "rustfmt --edition 2024 src/platform/macos_adapter_tests/*.rs"

[tasks."fmt:check:macos"]
description = "Check isolated macOS Adapter formatting"
run = "rustfmt --edition 2024 --check src/platform/macos_adapter_tests/*.rs"

[tasks."test:macos"]
description = "Run native macOS Adapter tests"
run = "./scripts/cargo-artifacts.sh run -- cargo test --package spaceterm --all-targets --features macos-native-tests --locked macos"

[tasks."test:remote-resize:macos"]
description = "Verify Remote Pane resize propagation through a local OpenSSH Control Connection"
run = "./scripts/test-remote-resize-macos.sh"

[tasks."lint:macos:scripts"]
description = "Check macOS scripts and package metadata"
run = '''
set -eu
bash -n scripts/package-macos.sh scripts/verify-macos-package.sh scripts/run-development-app-macos.sh scripts/test-remote-resize-macos.sh
shellcheck -x scripts/package-macos.sh scripts/verify-macos-package.sh scripts/run-development-app-macos.sh scripts/test-remote-resize-macos.sh
python3 -c 'import ast, pathlib, sys; [ast.parse(pathlib.Path(name).read_text(), filename=name) for name in sys.argv[1:]]' scripts/measure-macos-terminal-resources.py
plutil -lint packaging/macos/Info.plist
plutil -lint packaging/macos/Development-Info.plist
plutil -lint packaging/macos/AppearanceExerciser-Info.plist
plutil -lint packaging/macos/Entitlements.plist
'''

[tasks."validate:macos"]
description = "Run the full macOS validation gate"
run = [
  { task = "validate" },
  { task = "fmt:check:macos" },
  { task = "test:macos" },
  { task = "lint:macos:scripts" },
]

[tasks."bench:macos:resources"]
description = "Sample one macOS application process without administrator privileges"
usage = '''
arg "<pid>" help="SpaceTerm process ID"
arg "[duration]" help="Duration in seconds" default="20"
arg "[interval]" help="Sampling interval in seconds" default="1"
'''
run = 'python3 scripts/measure-macos-terminal-resources.py "${usage_pid?}" --duration "${usage_duration}" --interval "${usage_interval}"'

[tasks."package:macos"]
description = "Build and verify the macOS app and disk image"
usage = '''
arg "[build_number]" help="Application build number" default="1"
'''
run = 'CARGO_TARGET_DIR=target ./scripts/cargo-artifacts.sh run -- ./scripts/package-macos.sh --build-number "${usage_build_number}"'

[tasks."package:macos:install"]
description = "Build, verify, and install the macOS app"
run = [
  { task = "package:macos" },
  "rm -rf -- /Applications/SpaceTerm.app",
  "/usr/bin/ditto dist/SpaceTerm.app /Applications/SpaceTerm.app",
]

[tasks."package:macos:universal"]
description = "Build universal macOS Apple Silicon and Intel artifacts"
usage = '''
arg "[build_number]" help="Application build number" default="1"
'''
run = 'CARGO_TARGET_DIR=target ./scripts/cargo-artifacts.sh run -- ./scripts/package-macos.sh --universal --build-number "${usage_build_number}"'

[tasks."package:macos:verify"]
description = "Verify existing macOS artifacts"
run = "./scripts/verify-macos-package.sh"

[tasks."package:macos:open"]
description = "Open the packaged macOS application"
run = "open -n dist/SpaceTerm.app"

[tasks."package:macos:open-dmg"]
description = "Open the macOS installer disk image"
run = "open dist/SpaceTerm.dmg"

[tasks."package:macos:info"]
description = "Show macOS package metadata, architectures, signature, and sizes"
run = [
  "plutil -p dist/SpaceTerm.app/Contents/Info.plist",
  "lipo -archs dist/SpaceTerm.app/Contents/MacOS/SpaceTerm",
  "codesign --display --verbose=2 dist/SpaceTerm.app",
  "ls -lh dist/SpaceTerm.dmg dist/SpaceTerm.app/Contents/MacOS/SpaceTerm",
]

[tasks."deps:metal:macos"]
description = "Install Xcode's Metal compiler component for native GPUI builds"
run = "xcodebuild -downloadComponent MetalToolchain"
