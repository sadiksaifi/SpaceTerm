[package]
name = "spaceterm-connections"
publish = false
edition = "2024"

[features]
native-tests = []
test-support = []

[dependencies]
spaceterm-server = { path = "../spaceterm-server", features = ["client"] }
zeroize = "=1.9.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
async-channel = "=2.5.0"
getrandom = "=0.4.3"
base64 = "=0.22.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
security-framework-sys = "=2.17.0"
core-foundation = "=0.10.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", features = ["blocking-api"] }
futures-lite = "=2.6.1"
async-io = "=2.6.0"
pollster = "=0.4.0"
