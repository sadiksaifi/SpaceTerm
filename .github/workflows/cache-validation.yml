name: Cache macOS validation

# Release tags can restore caches saved on main, but not on other tags.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cache-validation.yml
      - .github/workflows/release.yml
      - .mise.toml
      - rust-toolchain.toml
      - Cargo.lock
      - Cargo.toml
      - '**/Cargo.toml'
      - scripts/cargo-artifact-supervisor.py
      - scripts/test-cargo-artifacts.sh
      - third_party/ghostty
      - third_party/libghostty-vt-sys/build.rs
      - third_party/libghostty-vt-sys/patches/**
      - packaging/macos/sparkle.json

permissions:
  contents: read

concurrency:
  group: cache-macos-validation
  cancel-in-progress: true

jobs:
  validation:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v4
      - name: Install Xcode Metal tools
        run: mise run deps:metal:macos
      - name: Identify validation cache
        id: validation-cache-key
        env:
          INPUT_HASH: ${{ hashFiles('Cargo.lock', 'Cargo.toml', '**/Cargo.toml', 'rust-toolchain.toml', '.mise.toml', 'third_party/libghostty-vt-sys/build.rs', 'third_party/libghostty-vt-sys/patches/*.patch', 'packaging/macos/sparkle.json') }}
        run: |
          xcode=$(xcodebuild -version | shasum | cut -d ' ' -f 1)
          ghostty=$(git rev-parse HEAD:third_party/ghostty)
          echo "key=validation-macos-26-${RUNNER_ARCH}-${xcode}-${INPUT_HASH}-${ghostty}" >> "$GITHUB_OUTPUT"
      - name: Restore validation build cache
        id: validation-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            target/debug
            target/sparkle
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: ${{ steps.validation-cache-key.outputs.key }}
      - name: Validate
        run: mise run validate:macos
      - name: Save validation build cache
        if: steps.validation-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            target/debug
            target/sparkle
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: ${{ steps.validation-cache.outputs.cache-primary-key }}
