name: Release

# Manual releases use main's cache scope. No workflow runs on a push or pull request.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without v, at least 0.10.0
        required: true
        type: string
      mode:
        description: Unsigned plan check, protected signed rehearsal, or publication
        type: choice
        default: unsigned
        options: [unsigned, signed, publish]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  MISE_LOCKED: 'true'
  SPACETERM_RELEASE_PLAN: dist/release-plan.json
  SPACETERM_RELEASE_APPLE_TEAM_ID: ${{ vars.SPACETERM_RELEASE_APPLE_TEAM_ID }}
  SPACETERM_RELEASE_APPLE_IDENTITY: ${{ vars.SPACETERM_RELEASE_APPLE_IDENTITY }}
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: target/release-build
  RUSTC_WRAPPER: ''
  TZ: UTC

jobs:
  plan:
    name: Plan and notes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      source: ${{ steps.plan.outputs.source }}
      mode: ${{ steps.plan.outputs.mode }}
      compatibility: ${{ steps.plan.outputs.compatibility }}
      compatibility-any: ${{ steps.plan.outputs.compatibility-any }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python git-cliff node npm:tagsmith
          version: 2026.10.4
      - name: Freeze release inputs and local tag
        id: plan
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'SpaceTerm releases'
          git config user.email 'releases@spaceterm.peblon.com'
          mise run release:plan "$RELEASE_VERSION" "$RELEASE_MODE"
      - name: Check unsigned release policy
        if: inputs.mode == 'unsigned'
        run: mise run release:check-tools
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: release-plan-${{ github.run_attempt }}
          path: |
            dist/release-plan.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Validate release
    needs: plan
    if: needs.plan.outputs.mode != 'unsigned'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-build-tools
        with:
          validation: 'true'
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - name: Validate tooling, source and migration fixtures
        run: mise run release:check

  compile-macos:
    name: Compile macos
    needs: plan
    if: needs.plan.outputs.mode != 'unsigned'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-build-tools
        id: tools
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - name: Compile Core and desktop without private credentials
        run: mise run release:pipeline compile
      - name: Save Zig dependencies
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/zig' || '~/.cache/zig' }}
          key: ${{ steps.tools.outputs.zig-cache-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: compiled-macos-${{ github.run_attempt }}
          path: dist/compiled/aarch64-apple-darwin/inputs.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  compile-linux:
    name: Compile linux
    needs: plan
    if: needs.plan.outputs.mode != 'unsigned'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-build-tools
        id: tools
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - name: Compile Core and desktop without private credentials
        run: mise run release:pipeline compile
      - name: Save Zig dependencies
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'macOS' && '~/Library/Caches/zig' || '~/.cache/zig' }}
          key: ${{ steps.tools.outputs.zig-cache-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: compiled-linux-${{ github.run_attempt }}
          path: dist/compiled/x86_64-unknown-linux-gnu/inputs.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  authorize:
    name: Authorize validated release tag
    needs: [plan, validate]
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - name: Create remote tag only for publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:pipeline tag

  core-macos:
    name: Sign Core macos
    needs: [plan, compile-macos, authorize]
    environment: release
    runs-on: macos-26
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile-macos.outputs.artifact-id }}
          path: dist/compiled
      - uses: ./.github/actions/release-resume
        with:
          lane: core-macos
      - name: Sign finalized Core bytes without compiling
        timeout-minutes: 40
        env:
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
          SPACETERM_RELEASE_DEVID_P12_BASE64: ${{ secrets.SPACETERM_RELEASE_DEVID_P12_BASE64 }}
          SPACETERM_RELEASE_DEVID_P12_PASSWORD: ${{ secrets.SPACETERM_RELEASE_DEVID_P12_PASSWORD }}
          SPACETERM_RELEASE_NOTARY_P8: ${{ secrets.SPACETERM_RELEASE_NOTARY_P8 }}
          SPACETERM_RELEASE_NOTARY_KEY_ID: ${{ vars.SPACETERM_RELEASE_NOTARY_KEY_ID }}
          SPACETERM_RELEASE_NOTARY_ISSUER_ID: ${{ vars.SPACETERM_RELEASE_NOTARY_ISSUER_ID }}
        run: mise run release:pipeline sign-core dist/compiled/inputs.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: core-aarch64-apple-darwin-${{ github.run_attempt }}
          path: dist/release-core/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded notarization evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-core-macos-${{ github.run_attempt }}
          path: dist/notarization/
          if-no-files-found: ignore
          retention-days: 30

  core-linux:
    name: Sign Core linux
    needs: [plan, compile-linux, authorize]
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile-linux.outputs.artifact-id }}
          path: dist/compiled
      - uses: ./.github/actions/release-resume
        with:
          lane: core-linux
      - name: Sign finalized Core bytes without compiling
        env:
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
        run: mise run release:pipeline sign-core dist/compiled/inputs.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: core-x86_64-unknown-linux-gnu-${{ github.run_attempt }}
          path: dist/release-core/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded notarization evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-core-linux-${{ github.run_attempt }}
          path: dist/notarization/
          if-no-files-found: ignore
          retention-days: 30

  desktop-macos:
    name: Package desktop macos
    needs: [plan, compile-macos, core-macos, core-linux]
    environment: release
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python github:sparkle-project/Sparkle
          version: 2026.10.4
      - name: Select the compilation SDK for native resource assembly
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile-macos.outputs.artifact-id }}
          path: dist/compiled
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-macos.outputs.artifact-id }},${{ needs.core-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release-core
      - uses: ./.github/actions/release-resume
        with:
          lane: desktop
      - name: Package compiled desktop with both finalized Core archives
        timeout-minutes: 80
        env:
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
          SPACETERM_RELEASE_DEVID_P12_BASE64: ${{ secrets.SPACETERM_RELEASE_DEVID_P12_BASE64 }}
          SPACETERM_RELEASE_DEVID_P12_PASSWORD: ${{ secrets.SPACETERM_RELEASE_DEVID_P12_PASSWORD }}
          SPACETERM_RELEASE_NOTARY_P8: ${{ secrets.SPACETERM_RELEASE_NOTARY_P8 }}
          SPACETERM_RELEASE_NOTARY_KEY_ID: ${{ vars.SPACETERM_RELEASE_NOTARY_KEY_ID }}
          SPACETERM_RELEASE_NOTARY_ISSUER_ID: ${{ vars.SPACETERM_RELEASE_NOTARY_ISSUER_ID }}
        run: mise run release:pipeline desktop dist/compiled/inputs.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: desktop-macos-${{ github.run_attempt }}
          path: dist/release-desktop-macos/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded notarization evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-desktop-${{ github.run_attempt }}
          path: dist/notarization/
          if-no-files-found: ignore
          retention-days: 30

  desktop-linux:
    name: Package desktop linux
    needs: [plan, compile-linux, core-macos, core-linux]
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
      - name: Install package verification dependencies
        run: mise run release:setup-linux-verification
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile-linux.outputs.artifact-id }}
          path: dist/compiled
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-macos.outputs.artifact-id }},${{ needs.core-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release-core
      - name: Package compiled desktop with both finalized Core archives
        env:
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
        run: mise run release:pipeline desktop dist/compiled/inputs.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: desktop-linux-${{ github.run_attempt }}
          path: dist/release-desktop-linux/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded notarization evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-desktop-${{ github.run_attempt }}
          path: dist/notarization/
          if-no-files-found: ignore
          retention-days: 30

  floor-smoke:
    name: Activate final Linux Core from its floor
    needs: [plan, core-linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-linux.outputs.artifact-id }}
          path: dist/release-core
      - name: Authorize disposable runner account's user service
        run: sudo loginctl enable-linger "$USER"
      - name: Install and activate the first release or update the actual floor
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:pipeline floor-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: floor-smoke-${{ github.run_attempt }}
          path: dist/floor-smoke.json
          if-no-files-found: error
          retention-days: 14

  compatibility:
    name: Pair ${{ matrix.candidate }} with ${{ matrix.release }}
    needs: plan
    if: needs.plan.outputs.mode != 'unsigned' && needs.plan.outputs.compatibility-any == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.compatibility) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-build-tools
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - name: Authorize the disposable floor account's user service
        if: matrix.candidate == 'client'
        run: sudo loginctl enable-linger "$USER"
      - name: Check both protocol lanes against the listed release
        env:
          GH_TOKEN: ${{ github.token }}
          PAIRED_TAG: ${{ matrix.release }}
          CANDIDATE: ${{ matrix.candidate }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: mise run compat:pair "$PAIRED_TAG" --candidate "$CANDIDATE" --release-tag "$RELEASE_TAG"

  publish:
    name: Verify, attest and publish
    needs: [plan, core-macos, core-linux, desktop-macos, desktop-linux, floor-smoke, compatibility]
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'unsigned' &&
      needs.core-macos.result == 'success' && needs.core-linux.result == 'success' &&
      needs.desktop-macos.result == 'success' && needs.desktop-linux.result == 'success' &&
      needs.floor-smoke.result == 'success' &&
      (needs.compatibility.result == 'success' ||
       (needs.plan.outputs.compatibility-any == 'false' && needs.compatibility.result == 'skipped'))
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
      - name: Install package verification dependencies
        run: mise run release:setup-linux-verification
      - uses: ./.github/actions/release-plan
        with:
          artifact-id: ${{ needs.plan.outputs.artifact-id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-macos.outputs.artifact-id }},${{ needs.core-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release-core
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.desktop-macos.outputs.artifact-id }}
          path: dist/release-desktop-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.desktop-linux.outputs.artifact-id }}
          path: dist/release-desktop-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.floor-smoke.outputs.artifact-id }}
          path: dist
      - name: Verify all products and sign updater assets
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
        run: mise run release:assemble "$RELEASE_TAG"
      - name: Attest final post-stapling archives and disk image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.dmg
      - name: Publish the complete draft with Latest held
        if: needs.plan.outputs.mode == 'publish'
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: mise run release:publish "$RELEASE_TAG" --notes dist/release-notes.md
      - name: Retain signed rehearsal assets without publishing
        if: needs.plan.outputs.mode == 'signed'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-rehearsal-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
