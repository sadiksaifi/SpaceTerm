name: Plan release
description: Tag the dispatched source and derive this run's release plan, identical in every job
inputs:
  notes:
    description: Also generate the git-cliff release notes, for compilation and publication only
    default: 'false'
runs:
  using: composite
  steps:
    - name: Fetch history and tags for floors and notes
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --quiet --unshallow --tags origin
        else
          git fetch --quiet --tags origin
        fi
    - name: Install git-cliff
      if: inputs.notes == 'true'
      shell: bash
      run: mise install git-cliff
    - name: Tag and plan the release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_NOTES_WANTED: ${{ inputs.notes }}
      run: |
        if [ "$RELEASE_NOTES_WANTED" = true ]; then
          mise run release:plan "$RELEASE_VERSION" --notes
        else
          mise run release:plan "$RELEASE_VERSION"
        fi
