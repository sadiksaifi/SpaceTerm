[package]
name = "spaceterm-status-area"
publish = false
edition = "2024"

[[bin]]
name = "spaceterm-status-area"
path = "src/main.rs"

[dependencies]
libc = "=0.2.189"
thiserror = "2.0.17"
spaceterm-server = { path = "../spaceterm-server" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "=0.3.1"
objc2 = "0.6"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAlert", "NSApplication", "NSButton", "NSButtonCell", "NSCell", "NSControl", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWorkspace", "block2", "libc", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSArray", "NSBundle", "NSEnumerator", "NSObject", "NSString", "NSURL", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", features = ["blocking-api"] }
