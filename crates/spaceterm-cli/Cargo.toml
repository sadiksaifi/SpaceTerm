[package]
name = "spaceterm-cli"
publish = false
edition = "2024"

[features]
default = []
client = ["spaceterm-server/client"]

[[example]]
name = "persistent_pane"
required-features = ["client"]

[[example]]
name = "pane_takeover"
required-features = ["client"]

[[example]]
name = "terminal_input"
required-features = ["client"]

[[bin]]
name = "spaceterm"
path = "src/main.rs"

[dependencies]
zeroize = "=1.9.0"
signal-hook = "=0.3.18"
rustix = { version = "=1.1.5", features = ["termios", "event"] }
base64 = "=0.22.1"
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
clap_complete = "=4.6.11"
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
libc = "=0.2.189"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
ring = "=0.17.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.151"
spaceterm = { path = "../..", default-features = false }
spaceterm-connections = { path = "../spaceterm-connections" }
spaceterm-server = { path = "../spaceterm-server", features = ["client"] }

[[example]]
name = "restored_workspace"
required-features = ["client"]

[[example]]
name = "shared_workspaces"
required-features = ["client"]

[[example]]
name = "repository_reads"
required-features = ["client"]

[dev-dependencies]
spaceterm-directories = { path = "../spaceterm-directories" }

[[example]]
name = "service_session"
required-features = ["client"]

[[example]]
name = "directory_recovery"
required-features = ["client"]

[[example]]
name = "worktree_writes"
required-features = ["client"]

[[example]]
name = "server_update"
required-features = ["client"]

[[example]]
name = "latency_probe"
required-features = ["client"]
