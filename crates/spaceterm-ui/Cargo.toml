[package]
name = "spaceterm-ui"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[features]
appearance-exerciser = []

[dependencies]
fuzzy-matcher = "=0.3.7"
gpui = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-09-26.1" }
lucide-icons = { version = "=1.34.0", default-features = false }
unicode-casefold = "=0.2.0"
unicode-segmentation = "=1.13.3"
zeroize = "=1.9.0"

[dev-dependencies]
gpui = { git = "https://github.com/sadiksaifi/zed", tag = "spaceterm-2026-09-26.1", features = ["test-support"] }
