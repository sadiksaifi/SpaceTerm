[package]
name = "spaceterm-server"
publish = false
edition = "2024"
autobins = false

[features]
default = []
client = []
# Lets another crate's tests serve a client handle in process.
test-support = ["client"]

[dependencies]
base64 = "=0.22.1"
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }
libc = "=0.2.189"
ring = "=0.17.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_bytes = "=0.11.19"
serde_json = "1.0"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
socket2 = "=0.6.5"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["alloc", "std"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
zeroize = "=1.9.0"
spaceterm-directories = { path = "../spaceterm-directories" }
thiserror = "2.0.17"
bytes = "1"
noq-udp = { version = "=1.4.0", default-features = false }
noq-proto = { version = "=1.4.0", default-features = false, features = ["rustls-ring"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }

# The server reads and requests its own System Permissions.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
