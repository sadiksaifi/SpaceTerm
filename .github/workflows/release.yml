name: Release

# A tag push releases. Every other run is a dry run of the same jobs: a generated update key,
# ad hoc code signatures, no notarization, no protected environment and nothing published.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .mise.toml
      - mise.lock
      - mise-tasks/**
      - packaging/**
      - cliff.toml
      - build.rs
      - build/**
      - crates/spaceterm-cli/build.rs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('release-dry-run-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  SPACETERM_RELEASE_DRY_RUN: ${{ github.event_name == 'push' && '0' || '1' }}
  # The Developer ID Team ID. The Release Core compiles it into the requirement it checks
  # retained runtimes against, and signing, verification and install.sh use it.
  SPACETERM_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
  # "Developer ID Application: <name> (<Team ID>)" for a release; a dry run signs ad hoc.
  SPACETERM_APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && vars.APPLE_SIGNING_IDENTITY || '-' }}

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # install_args selects this job's tools; keep mise run from installing the rest.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    outputs:
      tag: ${{ steps.release.outputs.tag || steps.dry-run.outputs.tag }}
      dry-run-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: "python node npm:tagsmith"
      - name: Validate annotated release tag
        if: github.event_name == 'push'
        id: release
        timeout-minutes: 5
        run: mise run release:validate "$GITHUB_REF_NAME"
      - name: Tag the dry run
        if: github.event_name != 'push'
        id: dry-run
        run: mise run release:dry-run:tag
      - name: Generate the dry-run update key
        if: github.event_name != 'push'
        id: key
        # A throwaway Ed25519 seed. Nothing it signs verifies under the release trust.
        run: echo "key=$(openssl rand -base64 32)" >> "$GITHUB_OUTPUT"

  validate-macos:
    name: Validate macOS
    needs: plan
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install the Xcode Metal toolchain
        timeout-minutes: 10
        run: mise run setup:metal:macos
      - name: Validate
        timeout-minutes: 60
        run: mise run validate:macos

  validate-linux:
    name: Validate Linux
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install Linux build and test packages
        timeout-minutes: 30
        run: mise bootstrap packages apply --yes --update
      - name: Check the development environment
        run: mise doctor project
      - name: Cache Rust builds
        uses: actions/cache@v6
        with:
          path: |
            target/debug
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: validate-linux-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'mise.lock', 'third_party/libghostty-vt-sys/build.rs', 'third_party/libghostty-vt-sys/patches/*.patch') }}
      - name: Validate
        timeout-minutes: 60
        run: mise run validate:linux

  notes:
    name: Write the release notes
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
        with:
          install_args: "python git-cliff"
      - name: Tag the dry run
        if: github.event_name != 'push'
        run: mise run release:dry-run:tag
      - name: Run git-cliff
        run: mise run release:notes --output dist/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  core:
    name: Build and sign SpaceTerm Core (${{ matrix.target }})
    # Signing starts only after both platforms pass validation.
    needs: [plan, validate-macos, validate-linux]
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Tag the dry run
        if: github.event_name != 'push'
        run: mise run release:dry-run:tag
      - name: Install Linux build packages
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: mise bootstrap packages apply --yes --update
      - name: Fetch locked Rust dependencies
        timeout-minutes: 10
        run: mise run setup:deps
      - name: Build, sign, notarize and staple SpaceTerm Core
        timeout-minutes: 100
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ github.event_name == 'push' && secrets.UPDATE_SIGNING_KEY || needs.plan.outputs.dry-run-key }}
          MACOS_SIGNING_CERTIFICATE_P12: ${{ runner.os == 'macOS' && github.event_name == 'push' && secrets.MACOS_SIGNING_CERTIFICATE_P12 || '' }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && github.event_name == 'push' && secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD || '' }}
          APP_STORE_CONNECT_API_KEY: ${{ runner.os == 'macOS' && github.event_name == 'push' && secrets.APP_STORE_CONNECT_API_KEY || '' }}
          APP_STORE_CONNECT_KEY_ID: ${{ runner.os == 'macOS' && github.event_name == 'push' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ runner.os == 'macOS' && github.event_name == 'push' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
        run: mise run release:core "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: core-${{ matrix.target }}
          path: dist/release-core/
          if-no-files-found: error
          retention-days: 7

  desktop-macos:
    name: Package, sign and notarize the macOS desktop
    needs: [plan, notes, core]
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Tag the dry run
        if: github.event_name != 'push'
        run: mise run release:dry-run:tag
      - name: Install the Xcode Metal toolchain
        timeout-minutes: 10
        run: mise run setup:metal:macos
      - name: Fetch locked Rust dependencies
        timeout-minutes: 10
        run: mise run setup:deps
      - name: Collect both signed Core builds
        uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/release-core
      - name: Collect the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: dist
      - name: Package, sign, notarize and staple the app, disk image and appcast
        timeout-minutes: 130
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ github.event_name == 'push' && secrets.UPDATE_SIGNING_KEY || needs.plan.outputs.dry-run-key }}
          MACOS_SIGNING_CERTIFICATE_P12: ${{ github.event_name == 'push' && secrets.MACOS_SIGNING_CERTIFICATE_P12 || '' }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD || '' }}
          APP_STORE_CONNECT_API_KEY: ${{ github.event_name == 'push' && secrets.APP_STORE_CONNECT_API_KEY || '' }}
          APP_STORE_CONNECT_KEY_ID: ${{ github.event_name == 'push' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ github.event_name == 'push' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
        run: mise run release:desktop:macos "$RELEASE_TAG" --notes dist/release-notes.md --core dist/release-core
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-macos
          path: dist/release-desktop-macos/
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: Package the x86_64 Linux desktop
    # It holds no secret: release:assemble signs its archive.
    needs: [plan, notes, core]
    runs-on: ubuntu-26.04
    # mise pins Zig's glibc target and the Ubuntu 22.04 native-library sysroot.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Tag the dry run
        if: github.event_name != 'push'
        run: mise run release:dry-run:tag
      - name: Install Linux build packages
        timeout-minutes: 10
        run: mise bootstrap packages apply --yes --update
      - name: Fetch locked Rust dependencies
        timeout-minutes: 10
        run: mise run setup:deps
      - name: Collect both signed Core builds
        uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/release-core
      - name: Collect the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: dist
      - name: Package the Linux desktop
        timeout-minutes: 50
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          # A dry run trusts its generated key. A release trusts packaging/update-trust.json.
          UPDATE_SIGNING_KEY: ${{ github.event_name != 'push' && needs.plan.outputs.dry-run-key || '' }}
        run: mise run release:desktop:linux "$RELEASE_TAG" --notes dist/release-notes.md --core dist/release-core
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: dist/release-desktop-linux/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign the feeds and publish the release
    needs: [plan, notes, core, desktop-macos, desktop-linux]
    environment: ${{ github.event_name == 'push' && 'release' || '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - name: Tag the dry run
        if: github.event_name != 'push'
        run: mise run release:dry-run:tag
      - name: Install Linux packages that verification runs
        timeout-minutes: 10
        run: mise bootstrap packages apply --yes --update
      - name: Collect both signed Core builds
        uses: actions/download-artifact@v8
        with:
          pattern: core-*
          merge-multiple: true
          path: dist/release-core
      - name: Collect the macOS desktop
        uses: actions/download-artifact@v8
        with:
          name: desktop-macos
          path: dist/release-desktop-macos
      - name: Collect the Linux desktop
        uses: actions/download-artifact@v8
        with:
          name: desktop-linux
          path: dist/release-desktop-linux
      - name: Collect the release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: dist
      - name: Sign the feeds and the Linux desktop archive
        timeout-minutes: 15
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ github.event_name == 'push' && secrets.UPDATE_SIGNING_KEY || needs.plan.outputs.dry-run-key }}
        run: mise run release:assemble "$RELEASE_TAG"
      - name: Publish the GitHub release
        timeout-minutes: 10
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: mise run release:publish "$RELEASE_TAG" --notes dist/release-notes.md
      - name: Keep the dry-run assets for inspection
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
