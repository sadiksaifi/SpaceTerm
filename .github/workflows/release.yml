name: Release

# The only workflow. Nothing runs on a push or pull request. Dispatch it on main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without v, at least 0.10.0
        required: true
        type: string
      publish:
        description: Publish the release as Latest and update Homebrew. Off, the run keeps the signed assets as artifacts.
        type: boolean
        default: false

permissions:
  contents: read
  # Every job reads this run's creation time to write the same tag, and signers read
  # earlier attempts' notarization evidence.
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

# GitHub enforces this: only the jobs that build from source restore or save caches. No job
# that holds a release secret or executes final products can read a cache entry.
cache-mode: none

env:
  MISE_TASK_RUN_AUTO_INSTALL: 'false'
  MISE_LOCKED: 'true'
  RELEASE_VERSION: ${{ inputs.version }}
  SPACETERM_RELEASE_PLAN: dist/release-plan.json
  SPACETERM_RELEASE_APPLE_TEAM_ID: ${{ vars.SPACETERM_RELEASE_APPLE_TEAM_ID }}
  SPACETERM_RELEASE_APPLE_IDENTITY: ${{ vars.SPACETERM_RELEASE_APPLE_IDENTITY }}
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: target/release-build
  RUSTC_WRAPPER: ''
  TZ: UTC

jobs:
  validate:
    name: Validate release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    cache-mode: write
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-build-tools
        with:
          validation: 'true'
      - name: Check the version against the Tagsmith release policy
        run: |
          git fetch --quiet --unshallow --tags origin
          mise install node npm:tagsmith
          mise run release:policy "$RELEASE_VERSION"
      - name: Validate tooling, source and migration fixtures
        run: mise run release:check
      - name: Stop the run so no signing or notarization continues
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  compile-macos:
    name: Compile macos
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    cache-mode: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-build-tools
        id: tools
      - uses: ./.github/actions/release-plan
        with:
          notes: 'true'
      - name: Compile Core and desktop without private credentials
        run: mise run release:pipeline compile
      - name: Save Zig dependencies
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/zig
          key: ${{ steps.tools.outputs.zig-cache-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: compiled-macos-${{ github.run_attempt }}
          path: dist/compiled/aarch64-apple-darwin/inputs.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  compile-linux:
    name: Compile linux
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    cache-mode: write
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-build-tools
        id: tools
      - uses: ./.github/actions/release-plan
        with:
          notes: 'true'
      - name: Compile Core and desktop without private credentials
        run: mise run release:pipeline compile
      - name: Save Zig dependencies
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/zig
          key: ${{ steps.tools.outputs.zig-cache-key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: compiled-linux-${{ github.run_attempt }}
          path: dist/compiled/x86_64-unknown-linux-gnu/inputs.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  compatibility-plan:
    name: Plan compatibility pairs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pairs.outputs.matrix }}
      any: ${{ steps.pairs.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
          cache: false
      - id: pairs
        run: mise run compat:plan

  compatibility:
    name: Pair ${{ matrix.candidate }} with ${{ matrix.release }}
    needs: compatibility-plan
    if: needs.compatibility-plan.outputs.any == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    cache-mode: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/release-build-tools
      - uses: ./.github/actions/release-plan
      - name: Authorize the disposable floor account's user service
        if: matrix.candidate == 'client'
        run: sudo loginctl enable-linger "$USER"
      - name: Check both protocol lanes against the listed release
        env:
          GH_TOKEN: ${{ github.token }}
          PAIRED_TAG: ${{ matrix.release }}
          CANDIDATE: ${{ matrix.candidate }}
        run: mise run compat:pair "$PAIRED_TAG" --candidate "$CANDIDATE" --release-tag "v$RELEASE_VERSION"

  core-macos:
    name: Sign Core macos
    needs: compile-macos
    environment: release
    runs-on: macos-26
    timeout-minutes: 50
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
          cache: false
      - uses: ./.github/actions/release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile-macos.outputs.artifact-id }}
          path: dist/compiled
      - uses: ./.github/actions/release-resume
        with:
          lane: core-macos
      - name: Sign finalized Core bytes without compiling
        timeout-minutes: 40
        env:
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
          SPACETERM_RELEASE_DEVID_P12_BASE64: ${{ secrets.SPACETERM_RELEASE_DEVID_P12_BASE64 }}
          SPACETERM_RELEASE_DEVID_P12_PASSWORD: ${{ secrets.SPACETERM_RELEASE_DEVID_P12_PASSWORD }}
          SPACETERM_RELEASE_NOTARY_P8: ${{ secrets.SPACETERM_RELEASE_NOTARY_P8 }}
          SPACETERM_RELEASE_NOTARY_KEY_ID: ${{ vars.SPACETERM_RELEASE_NOTARY_KEY_ID }}
          SPACETERM_RELEASE_NOTARY_ISSUER_ID: ${{ vars.SPACETERM_RELEASE_NOTARY_ISSUER_ID }}
        run: mise run release:pipeline sign-core dist/compiled/inputs.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: core-aarch64-apple-darwin-${{ github.run_attempt }}
          path: dist/release-core/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded notarization evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-core-macos-${{ github.run_attempt }}
          path: dist/notarization/
          if-no-files-found: ignore
          retention-days: 14

  core-linux:
    name: Sign Core linux
    needs: compile-linux
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
          cache: false
      - uses: ./.github/actions/release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile-linux.outputs.artifact-id }}
          path: dist/compiled
      # A resumed macOS desktop embeds the earlier attempt's Linux archive, so a rerun keeps it.
      - uses: ./.github/actions/release-resume
        with:
          lane: core-linux
      - name: Sign finalized Core bytes without compiling
        env:
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
        run: mise run release:pipeline sign-core dist/compiled/inputs.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: core-x86_64-unknown-linux-gnu-${{ github.run_attempt }}
          path: dist/release-core/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain the finalized Core for a rerun
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-core-linux-${{ github.run_attempt }}
          path: dist/notarization/
          if-no-files-found: ignore
          retention-days: 14

  verify-core-macos:
    name: Verify final Core macos without secrets
    needs: core-macos
    runs-on: macos-26
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
          cache: false
      - uses: ./.github/actions/release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-macos.outputs.artifact-id }}
          path: dist/release-core
      - name: Execute only on the credential-free verifier
        run: mise run release:pipeline verify-core
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: core-verification-macos-${{ github.run_attempt }}
          path: dist/core-verification/
          if-no-files-found: error
          retention-days: 14

  verify-core-linux:
    name: Verify final Core linux and its floor activation without secrets
    needs: core-linux
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
          cache: false
      - uses: ./.github/actions/release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-linux.outputs.artifact-id }}
          path: dist/release-core
      - name: Execute only on the credential-free verifier
        run: mise run release:pipeline verify-core
      - name: Authorize the disposable runner account's user service
        run: sudo loginctl enable-linger "$USER"
      - name: Install and activate the first release or update the actual floor
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:pipeline floor-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: core-verification-linux-${{ github.run_attempt }}
          path: |
            dist/core-verification/
            dist/floor-smoke.json
          if-no-files-found: error
          retention-days: 14

  desktop-macos:
    name: Package desktop macos
    needs: [compile-macos, core-macos, core-linux]
    environment: release
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python github:sparkle-project/Sparkle
          version: 2026.10.4
          cache: false
      - name: Select the compilation SDK for native resource assembly
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - uses: ./.github/actions/release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile-macos.outputs.artifact-id }}
          path: dist/compiled
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-macos.outputs.artifact-id }},${{ needs.core-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release-core
      - uses: ./.github/actions/release-resume
        with:
          lane: desktop
      - name: Package compiled desktop with both finalized Core archives
        timeout-minutes: 80
        env:
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
          SPACETERM_RELEASE_DEVID_P12_BASE64: ${{ secrets.SPACETERM_RELEASE_DEVID_P12_BASE64 }}
          SPACETERM_RELEASE_DEVID_P12_PASSWORD: ${{ secrets.SPACETERM_RELEASE_DEVID_P12_PASSWORD }}
          SPACETERM_RELEASE_NOTARY_P8: ${{ secrets.SPACETERM_RELEASE_NOTARY_P8 }}
          SPACETERM_RELEASE_NOTARY_KEY_ID: ${{ vars.SPACETERM_RELEASE_NOTARY_KEY_ID }}
          SPACETERM_RELEASE_NOTARY_ISSUER_ID: ${{ vars.SPACETERM_RELEASE_NOTARY_ISSUER_ID }}
        run: mise run release:pipeline desktop dist/compiled/inputs.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: desktop-macos-${{ github.run_attempt }}
          path: dist/release-desktop-macos/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain bounded notarization evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notary-desktop-${{ github.run_attempt }}
          path: dist/notarization/
          if-no-files-found: ignore
          retention-days: 14

  desktop-linux:
    name: Package desktop linux
    needs: [compile-linux, core-macos, core-linux]
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
          cache: false
      - name: Install package verification dependencies
        run: mise run release:setup-linux-verification
      - uses: ./.github/actions/release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.compile-linux.outputs.artifact-id }}
          path: dist/compiled
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-macos.outputs.artifact-id }},${{ needs.core-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release-core
      - name: Package compiled desktop with both finalized Core archives
        env:
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
        run: mise run release:pipeline desktop dist/compiled/inputs.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: desktop-linux-${{ github.run_attempt }}
          path: dist/release-desktop-linux/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  verify-desktop-macos:
    name: Verify final desktop macos without secrets
    needs: [desktop-macos, core-macos, core-linux]
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python github:sparkle-project/Sparkle
          version: 2026.10.4
          cache: false
      - uses: ./.github/actions/release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.desktop-macos.outputs.artifact-id }}
          path: dist/release-desktop-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-macos.outputs.artifact-id }},${{ needs.core-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release-core
      - name: Execute only on the credential-free verifier
        run: mise run release:pipeline verify-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: desktop-verification-macos-${{ github.run_attempt }}
          path: dist/desktop-verification/
          if-no-files-found: error
          retention-days: 14

  verify-desktop-linux:
    name: Verify final desktop linux without secrets
    needs: [desktop-linux, core-macos, core-linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
          cache: false
      - name: Install native verification dependencies
        run: mise run release:setup-linux-verification
      - uses: ./.github/actions/release-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.desktop-linux.outputs.artifact-id }}
          path: dist/release-desktop-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-macos.outputs.artifact-id }},${{ needs.core-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release-core
      - name: Execute only on the credential-free verifier
        run: mise run release:pipeline verify-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: desktop-verification-linux-${{ github.run_attempt }}
          path: dist/desktop-verification/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Assemble and publish
    needs:
      - validate
      - compatibility-plan
      - compatibility
      - core-macos
      - core-linux
      - verify-core-macos
      - verify-core-linux
      - desktop-macos
      - desktop-linux
      - verify-desktop-macos
      - verify-desktop-linux
    # The compatibility pairs alone may be skipped, when the list is empty.
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.verify-core-macos.result == 'success' && needs.verify-core-linux.result == 'success' &&
      needs.verify-desktop-macos.result == 'success' && needs.verify-desktop-linux.result == 'success' &&
      needs.compatibility-plan.result == 'success' &&
      (needs.compatibility.result == 'success' ||
       (needs.compatibility-plan.outputs.any == 'false' && needs.compatibility.result == 'skipped'))
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: python
          version: 2026.10.4
          cache: false
      - name: Install package verification dependencies
        run: mise run release:setup-linux-verification
      - uses: ./.github/actions/release-plan
        with:
          notes: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.core-macos.outputs.artifact-id }},${{ needs.core-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist/release-core
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.desktop-macos.outputs.artifact-id }}
          path: dist/release-desktop-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.desktop-linux.outputs.artifact-id }}
          path: dist/release-desktop-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify-core-macos.outputs.artifact-id }}
          path: dist/core-verification
      - name: Download the Linux Core verification and floor activation evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify-core-linux.outputs.artifact-id }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify-desktop-macos.outputs.artifact-id }},${{ needs.verify-desktop-linux.outputs.artifact-id }}
          merge-multiple: true
          path: dist/desktop-verification
      - name: Verify all products and sign updater assets
        env:
          SPACETERM_RELEASE_UPDATE_ED25519_SEED: ${{ secrets.SPACETERM_RELEASE_UPDATE_ED25519_SEED }}
        run: mise run release:assemble "v$RELEASE_VERSION"
      - name: Keep the signed assets of an unpublished run
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets-${{ github.run_attempt }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Attest the final archives and disk image
        if: inputs.publish
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.dmg
      - name: Push the tag and publish the release as Latest
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:publish "v$RELEASE_VERSION" --notes dist/release-notes.md
      - name: Check out the Homebrew tap with its token
        if: inputs.publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sadiksaifi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_PAT }}
          path: target/homebrew-tap
          # Only the push below uses this checkout's credentials; checkout removes them after the job.
          persist-credentials: true
      - name: Point the Homebrew cask at the published disk image
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise run release:homebrew "v$RELEASE_VERSION" target/homebrew-tap
          cd target/homebrew-tap
          ruby -c Casks/spaceterm.rb
          git config user.name 'SpaceTerm releases'
          git config user.email 'releases@spaceterm.peblon.com'
          git add Casks/spaceterm.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: release SpaceTerm v$RELEASE_VERSION"
            git push origin HEAD
          fi
