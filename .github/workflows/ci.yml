name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: Check pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # install_args selects this job's tools; keep mise run from installing the rest.
    env:
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: cocogitto
      # Squash merges make the title the commit message. cog verify reads an author from Git.
      - name: Validate Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          git config user.name "github-actions[bot]"
          cog verify "$TITLE"

  macos:
    name: Validate macOS
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install the Xcode Metal toolchain
        timeout-minutes: 10
        run: mise run setup:metal:macos
      - name: Cache Rust builds
        uses: actions/cache@v6
        with:
          path: |
            target/debug
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: validate-macos-26-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'mise.lock', 'third_party/libghostty-vt-sys/build.rs', 'third_party/libghostty-vt-sys/patches/*.patch') }}
      - name: Validate
        timeout-minutes: 60
        run: mise run validate:macos

  linux:
    name: Validate Linux
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@v5
      - name: Install system packages
        timeout-minutes: 10
        run: mise bootstrap packages apply --yes --update
      - name: Check the development environment
        run: mise doctor project
      - name: Cache Rust builds
        uses: actions/cache@v6
        with:
          path: |
            target/debug
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: validate-linux-${{ runner.arch }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml', 'mise.lock', 'third_party/libghostty-vt-sys/build.rs', 'third_party/libghostty-vt-sys/patches/*.patch') }}
      - name: Validate
        timeout-minutes: 60
        run: mise run validate:linux
