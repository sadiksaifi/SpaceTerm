[package]
name = "spaceterm"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
async-channel = "2.5.0"
gpui = "=0.2.2"
gpui-symbols = "=0.6.1"
image = { version = "=0.25.10", default-features = false }
libghostty-vt = { version = "=0.2.1", default-features = false, features = ["kitty-graphics", "png"] }
libc = "=0.2.189"
portable-pty = "=0.9.0"
smallvec = "=1.15.2"
thiserror = "2.0.17"
unicode-bidi = "=0.3.18"

[patch.crates-io]
libghostty-vt = { path = "third_party/libghostty-vt" }
libghostty-vt-sys = { path = "third_party/libghostty-vt-sys" }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "=0.2.7"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
