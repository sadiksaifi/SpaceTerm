min_version = "2026.9.6"

[settings]
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[env]
# Shared task code; see mise-tasks/lib.
PYTHONPATH = "{{config_root}}/mise-tasks/lib"
SPACETERM_LINUX_PACKAGE_TARGET = "x86_64-unknown-linux-gnu.2.35"
SPACETERM_LINUX_PACKAGE_SYSROOT = "{{config_root}}/target/linux-sysroots"

[tools]
python = "3.13.15"
ruff = "0.16.10"
ty = "0.0.84"
shellcheck = "0.11.0"
lefthook = "2.1.16"
cocogitto = "7.0.0"
git-cliff = "2.14.2"
node = "24.21.0"
zig = "0.16.0"
"cargo:cargo-packager" = { version = "0.11.8", os = ["macos"] }
"cargo:cargo-sweep" = "0.8.0"
"cargo:cargo-zigbuild" = { version = "0.23.4", os = ["linux"] }
"npm:skills" = "1.7.0"
"npm:tagsmith" = "1.2.0"
# The signed updater framework and its signing tools.
"github:sparkle-project/Sparkle" = { version = "2.10.0", asset_pattern = "Sparkle-2.10.0.tar.xz", os = ["macos"] }

[doctor.checks.xcode]
description = "Xcode 26 or newer with the Metal toolchain"
run = "python -m spaceterm_tasks.doctor xcode"
os = ["macos"]
hint = "Install Xcode 26 or newer, then run mise run setup:metal:macos"

[doctor.checks.terminfo]
description = "The terminfo compiler"
run = "python -m spaceterm_tasks.doctor tools tic infocmp"
hint = "Install ncurses (ncurses-bin on Debian or Ubuntu)"

[doctor.checks.linux-libraries]
description = "Linux window system and font libraries"
run = "pkg-config --exists xkbcommon xkbcommon-x11 wayland-client xcb x11-xcb fontconfig freetype2"
os = ["linux"]
hint = "Run mise run setup:packages"

[doctor.checks.vulkan]
description = "A Vulkan loader for GPUI"
run = "python -m spaceterm_tasks.doctor vulkan"
os = ["linux"]
hint = "Run mise run setup:packages, then install the Vulkan driver for your GPU"

[doctor.checks.linux-tools]
description = "Desktop entry, D-Bus, SSH, and zsh tools that Linux tests run"
run = "python -m spaceterm_tasks.doctor tools desktop-file-validate dbus-daemon dbus-run-session ssh zsh"
os = ["linux"]
hint = "Run mise run setup:packages"

[doctor.checks.gio]
description = "System Python GIO bindings for desktop entry tests"
run = "python -m spaceterm_tasks.doctor gio"
os = ["linux"]
hint = "Run mise run setup:packages"

# Debian and Ubuntu packages for building and testing on Linux.
[bootstrap.packages]
"apt:build-essential" = { os = "linux" }
"apt:pkg-config" = { os = "linux" }
"apt:libxkbcommon-dev" = { os = "linux" }
"apt:libxkbcommon-x11-dev" = { os = "linux" }
"apt:libwayland-dev" = { os = "linux" }
"apt:libxcb1-dev" = { os = "linux" }
"apt:libx11-xcb-dev" = { os = "linux" }
"apt:libfontconfig-dev" = { os = "linux" }
"apt:libfreetype-dev" = { os = "linux" }
"apt:libvulkan1" = { os = "linux" }
"apt:mesa-vulkan-drivers" = { os = "linux" }
"apt:ncurses-bin" = { os = "linux" }
"apt:openssh-client" = { os = "linux" }
"apt:dbus" = { os = "linux" }
"apt:desktop-file-utils" = { os = "linux" }
"apt:zsh" = { os = "linux" }
"apt:python3-gi" = { os = "linux" }
"apt:gir1.2-glib-2.0" = { os = "linux" }
"apt:python3-pyatspi" = { os = "linux" }
"apt:python3-dbus" = { os = "linux" }
"apt:python3-speechd" = { os = "linux" }
"apt:at-spi2-core" = { os = "linux" }
"apt:dconf-service" = { os = "linux" }
"apt:libglib2.0-bin" = { os = "linux" }
"apt:gsettings-desktop-schemas" = { os = "linux" }
"apt:gir1.2-gtk-3.0" = { os = "linux" }
"apt:xvfb" = { os = "linux" }
"apt:x11-utils" = { os = "linux" }
"apt:x11-xkb-utils" = { os = "linux" }
"apt:xdotool" = { os = "linux" }
"apt:imagemagick" = { os = "linux" }
"apt:gnome-shell" = { os = "linux" }
"apt:orca" = { os = "linux" }
"apt:speech-dispatcher" = { os = "linux" }
"apt:alsa-utils" = { os = "linux" }

# Task conventions:
# - Name tasks <entry>[:<narrowing>...][:<platform>] from CONTEXT.md terms or the wrapped tool's
#   name. Create no aliases.
# - Keep single-tool tasks here. Put other task logic in standard-library Python under mise-tasks/,
#   with shared code and unittest tests in mise-tasks/lib. Prefer maintained external tools.
# - Give each Development launch mode its own task. Use usage arguments or flags for other choices.
# - End platform-only tasks with the platform segment. Shared names dispatch to <task>:{{ os() }}
#   when implementations differ.
# - Set environment variables with env, guard destructive tasks with confirm, and hide only
#   internal tasks.

[tasks.setup]
description = "Prepare the development environment and run its checks"
run = [
  { task = "setup:packages" },
  { task = "setup:hooks" },
  { task = "setup:submodules" },
  { task = "setup:deps" },
  { task = "setup:skills" },
  "mise doctor project",
]

[tasks."setup:packages"]
description = "Install the system packages this host needs, after confirmation"
raw = true
run = "mise bootstrap packages apply"

[tasks."setup:hooks"]
description = "Install the Git hooks in lefthook.yml"
run = "lefthook install --reset-hooks-path"

[tasks."setup:submodules"]
description = "Initialize and update pinned Git submodules"
run = "git submodule update --init --recursive"

[tasks."setup:deps"]
description = "Download locked Rust dependencies"
run = "cargo fetch --locked"

[tasks."setup:skills"]
description = "Install the agent skills listed in skills-lock.json and share them with Claude Code"
env = { DISABLE_TELEMETRY = "1" }
run = ["skills experimental_install", "python -m spaceterm_tasks.agent_skills"]

[tasks."setup:metal:macos"]
description = "Install the Xcode Metal toolchain for native GPUI builds"
run = "xcodebuild -downloadComponent MetalToolchain"

[tasks."setup:linux-toolchain"]
description = "Prepare the pinned Ubuntu 22.04 native libraries without installing host packages"
run = "python -m spaceterm_tasks.linux_toolchain"

[tasks.development]
description = "Run SpaceTerm Development from source"
run = [{ task = "development:{{ os() }}" }]

[tasks."development:workbench"]
description = "Open the Developer Workbench in SpaceTerm Development"
usage = '''
arg "[section]" help="Workbench section" default="appearance" {
  choices "appearance" "controls" "floating-surfaces" "modals" "terminal" "document"
}
'''
run = [{ task = "development:{{ os() }}", env = { SPACETERM_DEVELOPER_WORKBENCH = "{{usage.section}}" } }]

[tasks."development:updates"]
description = "Preview the real update UI in SpaceTerm Development with a simulated updater"
usage = '''
arg "[scenario]" help="Simulated updater state" default="available" {
  choices "available" "warning" "overdue" "startup-overdue" "startup-ready" "offline" "up-to-date" "check-error" "download-error" "verification-error" "install-error"
}
'''
run = [{ task = "development:{{ os() }}", env = { SPACETERM_UPDATE_PREVIEW = "{{usage.scenario}}" } }]

[tasks."fmt:check"]
description = "Check Rust and Python formatting"
run = [{ task = "fmt", args = ["--check"] }]

[tasks.lint]
description = "Run every linter that applies on any host"
run = [
  { task = "lint:rust" },
  { task = "lint:python" },
  { task = "lint:shell" },
  { task = "lint:diff" },
]

[tasks."lint:rust"]
description = "Lint every target and feature for the current platform"
run = "cargo clippy --all-targets --all-features --locked --no-deps -- -D warnings"

[tasks."lint:rust:portable"]
description = "Lint shared targets without native features"
run = "cargo clippy --package spaceterm --package spaceterm-directories --package spaceterm-server --package spaceterm-server-host --all-targets --no-default-features --locked --no-deps -- -D warnings"

[tasks."lint:python"]
description = "Lint and type-check the Python task code"
run = ["ruff check", "ty check"]

[tasks."lint:shell"]
description = "Check the release installer"
run = "shellcheck packaging/install.sh"

[tasks."lint:plist:macos"]
description = "Check the application identity property lists"
run = "plutil -lint packaging/macos/development/Info.plist packaging/macos/preflight/Info.plist packaging/macos/preflight/Entitlements.plist packaging/macos/spaceterm/Info.plist packaging/macos/spaceterm/Entitlements.plist"

[tasks."lint:diff"]
description = "Check the diff for whitespace errors"
run = "git diff --check"

[tasks."lint:commit"]
description = "Validate a Conventional Commit message file"
usage = 'arg "<file>" help="Commit message file"'
run = "cog verify --ignore-merge-commits --file {{usage.file | quote}}"

[tasks.check]
description = "Check every target and feature"
run = "cargo check --all-targets --all-features --locked"

[tasks."check:desktop"]
description = "Check the desktop without Development tools"
run = "cargo check --package spaceterm --lib --bins --no-default-features --features desktop --locked"

[tasks."check:portable"]
description = "Check shared targets without native features"
run = "cargo check --package spaceterm --package spaceterm-directories --package spaceterm-server --package spaceterm-server-host --all-targets --no-default-features --locked"

[tasks.test]
description = "Run tests with every feature for the current platform"
usage = 'arg "[filter]" help="Run only tests whose names contain this filter"'
run = "cargo test --all-targets --all-features --locked {{usage.filter | quote}}"

[tasks."test:portable"]
description = "Run shared tests without native features"
run = "cargo test --package spaceterm --package spaceterm-directories --package spaceterm-server --package spaceterm-server-host --all-targets --no-default-features --locked"

[tasks."test:rustdoc"]
description = "Compile and test Rust documentation examples"
# Explicit --doc selects generated C-header prose even when the sys crate has doctest = false.
run = "cargo test --workspace --exclude libghostty-vt-sys --doc --all-features --locked"

[tasks."test:conformance"]
description = "Run terminal protocol conformance tests"
run = "cargo test --package spaceterm --all-targets --features desktop-tests --locked terminal::conformance"

[tasks."test:native"]
description = "Run native Adapter tests for the current platform"
run = [{ task = "test:native:{{ os() }}" }]

[tasks."test:native:macos"]
description = "Run native macOS and shared Unix Adapter tests"
run = "cargo test --package spaceterm --all-targets --features native-tests --locked -- macos unix"

[tasks."test:native:linux"]
description = "Run native Linux and shared Unix Adapter tests"
run = "cargo test --package spaceterm --all-targets --features native-tests --locked -- linux unix"

[tasks."test:tools"]
description = "Test the shared task code in mise-tasks/lib"
usage = 'arg "[filter]" help="Run one unittest module or test by its full name"'
run = "python -m unittest {% if usage.filter %}{{usage.filter | quote}}{% else %}discover --start-directory mise-tasks/lib/tests --top-level-directory mise-tasks/lib{% endif %}"

[tasks.validate]
description = "Run the full validation gate for the current platform"
run = [{ task = "validate:{{ os() }}" }]

[tasks."validate:macos"]
description = "Run the full macOS validation gate"
run = [
  { task = "test:tools" },
  { task = "fmt:check" },
  { task = "lint" },
  { task = "lint:plist:macos" },
  { task = "check" },
  { task = "test" },
  { task = "test:runtime" },
  { task = "test:rustdoc" },
  { task = "test:native:macos" },
  { task = "engine:test" },
  { task = "engine:test:no-graphics" },
  { task = "test:package:macos" },
  { task = "test:install:macos" },
  { task = "test:updater:macos" },
]

[tasks."validate:linux"]
description = "Run the full Linux validation gate"
run = [
  { task = "test:tools" },
  { task = "fmt:check" },
  { task = "lint" },
  { task = "check" },
  { task = "test:accessibility:linux", args = ["--backend", "both"] },
  { task = "test:accessibility:regressions:linux" },
  { task = "test" },
  { task = "test:runtime" },
  { task = "test:rustdoc" },
  { task = "test:native:linux" },
  { task = "engine:test" },
  { task = "engine:test:no-graphics" },
  { task = "test:package:linux" },
  { task = "test:install:linux" },
  { task = "test:updater:linux" },
]

[tasks."validate:portable"]
description = "Run checks that need no native platform tooling"
run = [
  { task = "test:tools" },
  { task = "fmt:check" },
  { task = "lint:rust:portable" },
  { task = "lint:python" },
  { task = "lint:shell" },
  { task = "lint:diff" },
  { task = "check:portable" },
  { task = "test:portable" },
  { task = "test:runtime" },
]

[tasks."engine:build"]
description = "Build the pinned Ghostty source and SpaceTerm C bindings"
run = "cargo build --package libghostty-vt-sys --features kitty-graphics --locked"

[tasks."engine:bindings"]
description = "Regenerate Rust bindings from the matching patched Ghostty headers"
run = "cargo run --package libghostty-vt-sys --features bindgen-tool,kitty-graphics --bin gen-bindings --locked"

[tasks."engine:check"]
description = "Check every feature of the locally maintained Ghostty wrappers"
run = "cargo check --package libghostty-vt --all-features --locked"

[tasks."engine:lock"]
description = "Refresh local patched dependency entries without upgrading unrelated packages"
run = "cargo update --package libghostty-vt-sys --offline"

[tasks."engine:test"]
description = "Test terminal-library patches with the application feature set"
run = "cargo test --package libghostty-vt --package libghostty-vt-sys --lib --no-default-features --features libghostty-vt/kitty-graphics,libghostty-vt/png,libghostty-vt-sys/vendored --locked"

[tasks."engine:test:no-graphics"]
description = "Test the owned Rust wrappers with graphics disabled"
run = "cargo test --package libghostty-vt --package libghostty-vt-sys --lib --no-default-features --features libghostty-vt-sys/vendored --locked"

[tasks."engine:upstream:build"]
description = "Build a prepared Ghostty source copy while updating native patches"
usage = '''
arg "<source>" help="Prepared Ghostty source directory"
flag "--features <features>" help="Upstream VT feature selection" default="all"
'''
run = "zig build --build-file {{usage.source | quote}}/build.zig -Demit-lib-vt=true -Demit-xcframework=false -Dapp-runtime=none -Dcpu=baseline -Doptimize=Debug -Dvt-features={{usage.features | quote}}"

[tasks."engine:upstream:test"]
description = "Run upstream native VT tests in a prepared Ghostty source copy"
usage = '''
arg "<source>" help="Prepared Ghostty source directory"
flag "--filter <filter>" help="Run Zig tests whose names contain this text"
'''
run = "cd {{usage.source | quote}} && zig build test-lib-vt -Demit-lib-vt=true -Demit-xcframework=false -Dapp-runtime=none -Dcpu=baseline{% if usage.filter %} -Dtest-filter={{usage.filter | quote}}{% endif %}"

[tasks."artifacts:sweep"]
description = "Remove Cargo build artifacts unused for 14 days"
run = "cargo sweep --time 14"

[tasks."artifacts:clean"]
description = "Remove every Cargo build artifact"
confirm = "Remove every Cargo build artifact?"
run = "cargo clean"

[tasks."release:targets"]
description = "Validate the Tagsmith release configuration"
run = "tagsmith targets --json"

[tasks."release:preview"]
description = "Preview an annotated release tag without creating it"
usage = 'arg "<version>" help="Stable SemVer to release"'
run = "tagsmith tag --target spaceterm --channel stable --version {{usage.version | quote}} --dry-run --json"

[tasks."release:validate"]
description = "Validate an annotated release tag on origin"
usage = 'arg "<tag>" help="Stable release tag, for example v1.2.3"'
run = "tagsmith validate --tag {{usage.tag | quote}} --github-output"

[tasks."release:notes:preview"]
description = "Preview release notes for changes since the last release"
run = "git-cliff --config cliff.toml --unreleased --offline --strip all"

[tasks."server:test"]
description = "Test local server account admission and private storage"
run = "cargo test --package spaceterm-server --package spaceterm-server-host --package spaceterm-directories --all-features --locked"

[tasks."server:fmt"]
description = "Format the server crates"
usage = '''
flag "--check" help="Check formatting without changing files"
'''
run = "cargo fmt --package spaceterm-server --package spaceterm-server-host {% if usage.check %}--check{% endif %}"

[tasks."server:test:headless"]
description = "Test the server without native credential adapters"
run = "cargo test --package spaceterm-server --no-default-features --locked"

[tasks."server:check"]
description = "Check the local server and desktop account admission"
run = [
    "cargo clippy --package spaceterm-server --all-targets --all-features --locked -- -D warnings",
    "cargo clippy --package spaceterm-server --all-targets --no-default-features --locked -- -D warnings",
    "cargo clippy --package spaceterm-server-host --all-targets --all-features --locked --no-deps -- -D warnings",
    "cargo clippy --package spaceterm-server-host --all-targets --no-default-features --locked --no-deps -- -D warnings",
]

[tasks."server:build"]
description = "Build the isolated headless Development server"
run = "cargo build --package spaceterm-server-host --no-default-features --locked"

[tasks."server:development"]
description = "Run the Development server explicitly in the foreground after local setup"
run = "cargo run --package spaceterm-server-host --no-default-features --locked -- serve spaceterm-development"

[tasks."server:setup-state"]
description = "Recover nonsecret Development state without starting or changing Stop"
run = "cargo run --package spaceterm-server-host --features client --locked -- setup-state spaceterm-development"

[tasks."server:status"]
description = "Connect to the existing Development server"
run = "cargo run --package spaceterm-server-host --features client --locked -- status spaceterm-development"

[tasks."server:dependencies"]
description = "Show the isolated headless server's production dependencies"
run = "cargo tree --package spaceterm-server-host --no-default-features --edges normal,build"

[tasks."server:lock"]
description = "Refresh local server dependencies without upgrading unrelated packages"
run = "cargo update --package spaceterm-server --offline"

[tasks."server:pane:test"]
description = "Verify persistent server Pane ownership with real headless PTYs"
run = "cargo test --package spaceterm --no-default-features --locked --lib runtime::server"

[tasks."server:pane:smoke"]
description = "Disconnect, resume, and close a Pane on the approved Development service"
run = "cargo run --package spaceterm-server-host --features client --example persistent_pane --locked"

[tasks."server:pane:shutdown:smoke"]
description = "Verify authenticated approved Development service shutdown terminates its running Pane"
run = "cargo run --package spaceterm-server-host --features client --example persistent_pane --locked -- --shutdown"

[tasks."server:pane:takeover:smoke"]
description = "Verify two account-local clients transfer control on the approved Development service"
run = [
  "cargo run --package spaceterm-server-host --features client --example pane_takeover --locked -- 1",
]

[tasks."server:input:smoke"]
description = "Verify account-local terminal input and native effects with the initial protocol major on an idle server"
run = [
  "cargo build --package spaceterm-server-host --features client --examples --bins --locked",
  "cargo run --package spaceterm-server-host --features client --example terminal_input --locked -- 1",
]

[tasks."server:workspace:smoke"]
description = "Exercise retained Development work through server kill and shutdown with the initial protocol major"
run = [
  "cargo build --package spaceterm-server-host --features client --examples --bins --locked",
  "cargo run --package spaceterm-server-host --features client --example restored_workspace --locked -- 1",
]

[tasks."server:shared:smoke"]
description = "Exercise shared edits, independent Pane control, lost outcomes and restart with the initial protocol major"
run = [
  "cargo build --package spaceterm-server-host --features client --examples --bins --locked",
  "cargo run --package spaceterm-server-host --features client --example shared_workspaces --locked -- 1",
]

[tasks."server:shared:desktop:test"]
description = "Test shared Workspace integration and server Pane presentation in the main app"
run = "cargo test --package spaceterm --lib --all-features --locked -- shared server_pane"

[tasks."server:ssh:desktop:test"]
description = "Test SSH account connections, retained intent and remote Pane presentation"
usage = '''
arg "[filter]" help="Run one regression instead of the SSH and Pane suites"
'''
run = "cargo test --package spaceterm --lib --all-features --locked -- {% if usage.filter %}{{usage.filter | quote}}{% else %}ssh::server terminal::server_session{% endif %}"

[tasks."server:ssh:native:test"]
description = "Verify an explicitly selected SSH account server on the native host"
run = "cargo test --package spaceterm --lib --all-features --locked -- ssh::server_process::tests::native::native_account_server_connect --ignored --exact --nocapture"

[tasks."server:worktree:smoke"]
description = "Exercise owning-server Worktree writes and interrupted originals with the initial protocol major"
run = [
  "cargo build --package spaceterm-server-host --features client --example worktree_writes --bins --locked",
  "cargo run --package spaceterm-server-host --features client --example worktree_writes --locked -- 1",
]

[tasks."server:repository:smoke"]
description = "Read owning-server Git facts and external Worktrees through two clients with the initial protocol major"
run = [
  "cargo build --package spaceterm-server-host --features client --example repository_reads --bins --locked",
  "cargo run --package spaceterm-server-host --features client --example repository_reads --locked -- 1",
]

[tasks."server:test:host"]
description = "Test the headless executable's build isolation"
run = "cargo test --package spaceterm-server-host --no-default-features --locked"

[tasks."server:update:build"]
description = "Build the signed native update check before code signing"
run = "cargo build --package spaceterm-server-host --features client --example server_update --locked"

[tasks."server:update:smoke"]
description = "Exercise exact signed updates against disposable Development service state"
usage = '''
arg "<previous-archive>" help="Verified signed initial server archive"
arg "<previous-signature>" help="Initial archive signature"
arg "<previous-sha256>" help="Initial complete archive SHA256"
arg "<candidate-archive>" help="Verified signed different server archive"
arg "<candidate-signature>" help="Candidate archive signature"
arg "<candidate-sha256>" help="Candidate complete archive SHA256"
flag "--confirm-disposable-development" help="Authorize replacement of disposable Development server work"
'''
run = "target/debug/examples/server_update {{usage.previous_archive | quote}} {{usage.previous_signature | quote}} {{usage.previous_sha256 | quote}} {{usage.candidate_archive | quote}} {{usage.candidate_signature | quote}} {{usage.candidate_sha256 | quote}} {% if usage.confirm_disposable_development %}--confirm-disposable-development{% endif %}"

[tasks."server:admission:host"]
description = "Observe refusal of a real other-account peer without sending requests"
run = "cargo test --package spaceterm-server --locked --lib host::tests::refuses_a_real_other_account_peer_without_sending_protocol_bytes -- --ignored --exact"

[tasks."server:service"]
description = "Explicitly control this build's account server service"
usage = '''
arg "<action>" help="status, install, start, stop, restart, uninstall, or enable-linger"
arg "[installation]" help="Verified retained installation directory for install"
flag "--confirm" help="Confirm Stop, Restart, or Uninstall after reviewing its effects"
'''
run = "cargo run --package spaceterm-server-host --no-default-features --locked -- service-{{usage.action}} spaceterm-development {% if usage.installation %}{{usage.installation | quote}}{% endif %}{% if usage.confirm %} --confirm{% endif %}"

[tasks."server:service:session:macos"]
description = "Verify authenticated Session survival and durable Stop on an installed macOS server"
usage = '''
arg "<identity>" help="Installed application identity"
arg "[installation]" help="Verified retained installation to install explicitly before the check"
'''
run = "cargo run --package spaceterm-server-host --features client --example service_session --locked -- {{usage.identity | quote}} {% if usage.installation %}{{usage.installation | quote}}{% endif %}"

[tasks."server:service:test:macos"]
description = "Verify launchd unload permits graceful cleanup in the current GUI login domain"
run = "cargo test --package spaceterm-server --all-features --locked --lib service::macos::tests::launchd_unload_allows_in_flight_cleanup_to_finish -- --ignored --exact"

[tasks."server:graphics:desktop:test"]
description = "Test bounded server graphics transfer, fixture parity, and desktop painting without native credentials"
run = [
  "cargo test --package spaceterm --lib --no-default-features --features desktop-tests --locked -- graphics",
  "cargo test --package spaceterm --lib --no-default-features --features desktop-tests --locked -- terminal::server_session",
]

[tasks."server:graphics:transport:test"]
description = "Test authenticated graphics transfers and slow readers with the initial protocol major with fixture identities"
run = "cargo test --package spaceterm-server --lib --features client --locked"

[tasks."server:directory:build"]
description = "Build the server directory-recovery check before native code signing"
run = "cargo build --package spaceterm-server-host --features client --example directory_recovery --bin spaceterm-server --locked"

[tasks."server:directory:smoke"]
description = "Exercise directory recovery on an idle Development server without native credential adapters"
usage = '''
arg "[major]" default="1" help="Initial protocol major (1)"
flag "--cleanup-exercise" help="Remove only the retained directory-recovery test Workspace"
'''
run = [
  { task = "server:directory:build" },
  "target/debug/examples/directory_recovery {{usage.major}} {% if usage.cleanup_exercise %}--cleanup{% endif %}",
]

[tasks."server:directory:run"]
description = "Run a built directory-recovery check without replacing its code signature"
usage = '''
arg "[major]" default="1" help="Initial protocol major (1)"
flag "--cleanup-exercise" help="Remove only the retained directory-recovery test Workspace"
'''
run = "target/debug/examples/directory_recovery {{usage.major}} {% if usage.cleanup_exercise %}--cleanup{% endif %}"
