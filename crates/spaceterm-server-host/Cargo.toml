[package]
name = "spaceterm-server-host"
publish = false
edition = "2024"

[features]
default = []
client = ["spaceterm-server/client"]
quic = ["spaceterm-server/quic"]

[[example]]
name = "persistent_pane"
required-features = ["client"]

[[example]]
name = "pane_takeover"
required-features = ["client"]

[[example]]
name = "terminal_input"
required-features = ["client"]

[[bin]]
name = "spaceterm-server"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spaceterm = { path = "../..", default-features = false }
spaceterm-server = { path = "../spaceterm-server", features = ["quic"] }
libc = "=0.2.189"

[[example]]
name = "restored_workspace"
required-features = ["client"]

[[example]]
name = "shared_workspaces"
required-features = ["client"]

[[example]]
name = "repository_reads"
required-features = ["client"]

[dev-dependencies]
spaceterm-directories = { path = "../spaceterm-directories" }

[[example]]
name = "service_session"
required-features = ["client"]

[[example]]
name = "directory_recovery"
required-features = ["client"]

[[example]]
name = "worktree_writes"
required-features = ["client"]

[[example]]
name = "server_update"
required-features = ["client"]

[[example]]
name = "latency_probe"
required-features = ["client"]
