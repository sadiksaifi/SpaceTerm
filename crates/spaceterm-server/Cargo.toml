[package]
name = "spaceterm-server"
publish = false
edition = "2024"
autobins = false

[features]
default = []
client = []

[dependencies]
base64 = "=0.22.1"
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }
libc = "=0.2.189"
ring = "=0.17.14"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
socket2 = "=0.6.5"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
zeroize = "=1.9.0"
spaceterm-directories = { path = "../spaceterm-directories" }
thiserror = "2.0.17"
