name: Project

on:
  issues:
    types: [assigned, unassigned]
  # Run trusted default-branch code for fork PRs, without checking out PR code.
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  issues: read
  pull-requests: read

concurrency:
  group: project-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find actionable work
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // No Project access or PAT is needed to decide whether this event needs a write.
            const { owner, repo } = context.repo;
            const number = context.payload.issue?.number ?? context.payload.pull_request.number;
            const work = { issues: [] };
            if (context.eventName === 'issues') {
              const { repository: { issue } } = await github.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) { id state assignees(first: 1) { totalCount } }
                  }
                }
              `, { owner, repo, number });
              if (issue.state === 'OPEN') work.issues.push(issue);
            } else {
              let cursor = null;
              do {
                const { repository: { pullRequest } } = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        id state merged isDraft
                        closingIssuesReferences(first: 100, after: $cursor) {
                          nodes {
                            id state
                            repository { nameWithOwner }
                            assignees(first: 1) { totalCount }
                          }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }
                `, { owner, repo, number, cursor });
                // Closed/merged items are already handled by the built-in Done workflows.
                if (pullRequest.merged) {
                  core.setOutput('needed', 'false');
                  return;
                }
                work.pullRequest = { id: pullRequest.id, state: pullRequest.state, draft: pullRequest.isDraft, number };
                const references = pullRequest.closingIssuesReferences;
                work.issues.push(...references.nodes.filter(issue =>
                  issue.repository.nameWithOwner === `${owner}/${repo}` && issue.state === 'OPEN'));
                cursor = references.pageInfo.hasNextPage ? references.pageInfo.endCursor : null;
              } while (cursor);
            }
            const needed = work.issues.length > 0 || work.pullRequest?.state === 'OPEN';
            core.setOutput('needed', needed ? 'true' : 'false');
            if (needed) core.setOutput('work', JSON.stringify(work));

      - name: Update project status
        if: steps.plan.outputs.needed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          WORK_ITEMS: ${{ steps.plan.outputs.work }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Actionable events must fail visibly if PROJECT_TOKEN is missing or expired.
            const repository = getOctokit(process.env.REPOSITORY_TOKEN);
            const work = JSON.parse(process.env.WORK_ITEMS);
            const projectId = 'PVT_kwHOBSqz-84BpZjm';
            const { node: project } = await github.graphql(`
              query($id: ID!) {
                node(id: $id) {
                  ... on ProjectV2 {
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }
            `, { id: projectId });
            const field = project?.field;
            const options = new Map(field?.options.map(option => [option.name, option.id]));
            for (const name of ['Backlog', 'In progress', 'In review', 'Done']) {
              if (!options.has(name)) throw new Error(`Missing project status: ${name}`);
            }

            const items = new Map();
            async function setStatus(contentId, status) {
              if (!items.has(contentId)) {
                // Adding an existing item returns it, so retries do not duplicate it.
                const { addProjectV2ItemById: { item } } = await github.graphql(`
                  mutation($project: ID!, $content: ID!) {
                    addProjectV2ItemById(input: {projectId: $project, contentId: $content}) {
                      item { id }
                    }
                  }
                `, { project: projectId, content: contentId });
                items.set(contentId, item.id);
              }
              await github.graphql(`
                mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field,
                    value: {singleSelectOptionId: $option}
                  }) { projectV2Item { id } }
                }
              `, { project: projectId, item: items.get(contentId), field: field.id, option: options.get(status) });
            }

            async function readIssue(id) {
              const { node } = await repository.graphql(`
                query($id: ID!) {
                  node(id: $id) {
                    ... on Issue { id state assignees(first: 1) { totalCount } }
                  }
                }
              `, { id });
              return node;
            }
            const assignedStatus = issue => issue.assignees.totalCount ? 'In progress' : 'Backlog';
            // Issues-only Backlog built-ins leave all open PRs to this Action. A draft is still
            // being worked on; a PR marked ready for review is under review.
            const open = work.pullRequest?.state === 'OPEN';
            const reviewing = open && !work.pullRequest.draft;
            const openStatus = reviewing ? 'In review' : 'In progress';
            if (open) await setStatus(work.pullRequest.id, openStatus);
            for (const issue of work.issues) {
              await setStatus(issue.id, open ? openStatus : assignedStatus(issue));
            }

            // A close/merge may have finished while the writes used their earlier snapshots.
            let currentPr;
            if (work.pullRequest) {
              const { repository: { pullRequest } } = await repository.graphql(`
                query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) { id state merged }
                  }
                }
              `, { ...context.repo, number: work.pullRequest.number });
              currentPr = pullRequest;
              if (currentPr.state !== 'OPEN' && items.has(currentPr.id)) {
                await setStatus(currentPr.id, 'Done');
              }
            }
            for (const issue of work.issues) {
              const current = await readIssue(issue.id);
              if (current.state === 'CLOSED') {
                await setStatus(issue.id, 'Done');
              } else if (currentPr?.state === 'CLOSED') {
                await setStatus(issue.id, assignedStatus(current));
                // Closure during the fallback write must not be overwritten either.
                if ((await readIssue(issue.id)).state === 'CLOSED') await setStatus(issue.id, 'Done');
              }
            }
