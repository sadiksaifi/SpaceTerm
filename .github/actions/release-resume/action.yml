name: Restore notarization evidence
description: Resume only a prior attempt in this same workflow run
inputs:
  lane:
    description: Core or desktop receipt artifact prefix
    required: true
runs:
  using: composite
  steps:
    - name: Select previous attempt's immutable artifact
      id: previous
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NOTARY_LANE: ${{ inputs.lane }}
      run: mise run release:pipeline resume "$NOTARY_LANE"
    - uses: actions/download-artifact@v8
      if: steps.previous.outputs.artifact-id != ''
      with:
        artifact-ids: ${{ steps.previous.outputs.artifact-id }}
        path: dist/notarization
