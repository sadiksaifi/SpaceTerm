enum KeyAction { KEY_ACTION_UNSPECIFIED = 0; KEY_PRESS = 1; KEY_REPEAT = 2; KEY_RELEASE = 3; }

message OperationId {
  Identity server = 1;
  Identity pairing = 2;
  Identity client = 3;
  Identity stream = 4;
  uint64 sequence = 5;
}
enum FailureClass {
  FAILURE_UNSPECIFIED = 0;
  INVALID = 1; STALE = 2; DENIED = 3; NOT_FOUND = 4; BUSY = 5;
  LIMIT = 6; UNAVAILABLE = 7; CONFLICT = 8; UNCERTAIN_DURABILITY = 9;
  RETIRED = 10; RESYNC_REQUIRED = 11;
}
// Error metadata is enum/counter data only. No native error or peer-provided text.
message Failure { FailureClass classification = 1; uint32 retry_after_ms = 2; }
message RevocationRequest { OperationId operation = 1; Identity target_pairing = 2; }
message RevocationStatus { OperationId operation = 1; Identity target_pairing = 2; }
enum RevocationState { REVOCATION_UNSPECIFIED = 0; PENDING = 1; REVOKED = 2; }
// The envelope signature is the receipt's signature. Its exact signed bytes may be retained.
message RevocationReceipt {
  OperationId operation = 1;
  Identity target_pairing = 2;
  RevocationState state = 3;
  uint64 store_revision = 4;
}
// This profile is usable with retained revoked-device verification material.
// It has no terminal, management, enrollment, startup, or ordinary status operation.
message RestrictedMessage {
  oneof kind {
    RevocationRequest revoke = 1;
    RevocationStatus status = 2;
    RevocationReceipt receipt = 3;
    Failure failure = 4;
  }
}
